<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Flow · Painel da Expedição (TV)</title>
<!--
  PAINEL DA TV — Shift Flow · Expedição BR3R
  Arquivo único: deixe na pasta da TV e abra com 2 cliques (precisa de internet).
  Mostra só números de produção: carregamentos, descarga de ME, tampa básica,
  devolução e dias sem incidente. NÃO busca Disciplina, relatos, faltas nem o
  cadastro de usuários. Atualiza os dados sozinho a cada 1 minuto.
  Tela cheia: clique uma vez na tela (ou aperte F11).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800;1,900&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --font:'Barlow', system-ui, 'Segoe UI', Roboto, sans-serif; --f-display:'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', sans-serif; --f-logo:'Barlow', 'Arial Black', sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:#050B1A; }
.sf-word { font-family:var(--f-logo); font-style:italic; font-weight:900; letter-spacing:-.5px; line-height:.92; color:#fff; white-space:nowrap; }
.sf-word em { font-style:italic; color:#2F7BFF; }
.sf-tag { font-family:var(--f-display); font-weight:600; letter-spacing:.14em; color:#DDE6F7; white-space:nowrap; }
/* ── MODO TV (100% da tela, escala pela largura da TV) ── */
body.tv-on { overflow:hidden; }
.tvm { --k:1; --u:calc(min(1vw, 1.78vh) * var(--k)); position:fixed; inset:0; z-index:4000; overflow:hidden; display:grid; grid-template-rows:auto auto 1fr auto; color:#fff;
  background:radial-gradient(120vw 60vh at 50% -20vh, rgba(20,99,255,.28), transparent 70%), #050B1A; font-family:var(--font); font-size:calc(var(--u) * 1.15); }
.tvm[hidden] { display:none; }
.tvm.nocursor, .tvm.nocursor * { cursor:none !important; }
.tvm-top { display:flex; align-items:center; gap:calc(var(--u) * 2); padding:calc(var(--u) * .9) calc(var(--u) * 1.6); }
.tvm-brand { display:flex; align-items:center; gap:calc(var(--u) * .6); }
.tvm-brand img { height:calc(var(--u) * 4.2); }
.tvm-brand .sf-word { font-size:calc(var(--u) * 2.9); }
.tvm-brand .sf-tag { font-size:calc(var(--u) * .85); margin-top:calc(var(--u) * .2); }
.tvm-title { flex:1; text-align:center; font-family:var(--f-display); font-weight:800; font-size:calc(var(--u) * 2.4); letter-spacing:.12em; color:#DDE6F7; }
.tvm-title small { display:block; font-family:var(--font); font-weight:500; font-size:calc(var(--u) * .8); letter-spacing:.02em; color:#8391AD; margin-top:calc(var(--u) * .2); }
.tvm-safe { display:flex; align-items:center; gap:calc(var(--u) * .6); padding:calc(var(--u) * .5) calc(var(--u) * 1.1); border-radius:calc(var(--u) * 1.2); background:rgba(43,208,127,.12); border:1px solid rgba(43,208,127,.45); }
.tvm-safe .ico { font-size:calc(var(--u) * 2); }
.tvm-safe b { font-family:var(--f-display); font-size:calc(var(--u) * 3.4); line-height:1; color:#2BD07F; }
.tvm-safe b.warn { color:#FFC21A; }
.tvm-safe span { font-size:calc(var(--u) * .9); line-height:1.15; color:#C2CCDF; }
.tvm-clock { text-align:right; }
.tvm-clock b { display:block; font-family:var(--f-display); font-weight:800; font-size:calc(var(--u) * 3.6); line-height:1; font-variant-numeric:tabular-nums; }
.tvm-clock small { font-size:calc(var(--u) * .9); color:#8391AD; text-transform:capitalize; }
.tvm-hazard { height:calc(var(--u) * .45); background:repeating-linear-gradient(-45deg, #FFC21A 0 calc(var(--u) * .8), #000 calc(var(--u) * .8) calc(var(--u) * 1.6)); }
.tvm-main { display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:calc(var(--u) * 1.1); padding:calc(var(--u) * 1.1) calc(var(--u) * 1.6); min-height:0; }
.tvm-load { color:#8391AD; font-size:calc(var(--u) * 1.4); padding:calc(var(--u) * 2); text-align:center; grid-column:1 / -1; }
.tvc { background:linear-gradient(180deg, #0F1D3D 0%, #0A1430 100%); border:1px solid rgba(86,130,255,.34); border-radius:calc(var(--u) * 1.2); padding:calc(var(--u) * 1.1) calc(var(--u) * 1.3); display:flex; flex-direction:column; gap:calc(var(--u) * .8); min-height:0; overflow:hidden; }
.tvc h2 { margin:0; font-family:var(--f-display); font-size:calc(var(--u) * 1.9); font-weight:800; letter-spacing:.02em; display:flex; justify-content:space-between; align-items:baseline; gap:calc(var(--u) * .6); flex-wrap:wrap; }
.tvc h2 span { font-family:var(--font); font-size:calc(var(--u) * .85); font-weight:500; color:#8391AD; letter-spacing:0; }
.tv-who b { display:block; font-family:var(--f-display); font-size:calc(var(--u) * 2.6); font-weight:800; color:#4D8DFF; line-height:1.05; }
.tv-who span { font-size:calc(var(--u) * .95); color:#C2CCDF; }
.tv-me { display:flex; align-items:center; gap:calc(var(--u) * 1.1); padding:calc(var(--u) * .7) calc(var(--u) * 1.1); border-radius:calc(var(--u) * 1); background:linear-gradient(90deg, rgba(43,208,127,.2), rgba(43,208,127,.04)); border:1.5px solid rgba(43,208,127,.55); }
.tv-me b { font-family:var(--f-display); font-size:calc(var(--u) * 7.5); font-weight:800; line-height:.95; color:#2BD07F; }
.tv-me span { font-size:calc(var(--u) * 1.25); color:#DDE6F7; line-height:1.2; }
.tv-me small { display:block; font-size:calc(var(--u) * .85); color:#8391AD; }
.tv-me.zero { background:linear-gradient(90deg, rgba(255,77,90,.22), rgba(255,77,90,.04)); border-color:rgba(255,77,90,.6); }
.tv-me.zero b { color:#FF4D5A; }
.tv-g2 { display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u) * .7); }
.tv-t { display:flex; align-items:center; gap:calc(var(--u) * .7); background:rgba(5,12,32,.45); border:1px solid rgba(86,130,255,.25); border-radius:calc(var(--u) * .9); padding:calc(var(--u) * .5) calc(var(--u) * .8); --c:#4D8DFF; }
.tv-t b { font-family:var(--f-display); font-size:calc(var(--u) * 3.4); font-weight:800; line-height:1; color:var(--c); }
.tv-t span { font-size:calc(var(--u) * .95); color:#C2CCDF; line-height:1.15; }
.tv-t strong { color:#fff; }
.tv-t.p { --c:#8CA3FF; } .tv-t.y { --c:#FFC21A; } .tv-t.v { --c:#B69CFF; }
.tv-mes { margin-top:auto; border-top:1px solid rgba(86,130,255,.25); padding-top:calc(var(--u) * .7); display:flex; flex-direction:column; gap:calc(var(--u) * .5); }
.tv-mes-g { display:grid; grid-template-columns:repeat(3, 1fr); gap:calc(var(--u) * .6); }
.tv-mes-g div { background:rgba(5,12,32,.45); border:1px solid rgba(86,130,255,.25); border-radius:calc(var(--u) * .8); padding:calc(var(--u) * .45) calc(var(--u) * .7); display:flex; flex-direction:column; }
.tv-mes-g span { font-size:calc(var(--u) * .85); color:#8391AD; }
.tv-mes-g b { font-family:var(--f-display); font-size:calc(var(--u) * 2.3); line-height:1.05; color:#4D8DFF; } .tv-mes-g b.g { color:#2BD07F; }
.tv-mes-g em { font-style:normal; font-weight:700; font-size:calc(var(--u) * .9); }
.tv-mes-g em.up { color:#2BD07F; } .tv-mes-g em.dn { color:#FF4D5A; } .tv-mes-g em.eq { color:#C2CCDF; }
.tv-mes-n { font-size:calc(var(--u) * .75); color:#8391AD; }
.tv-fo { font-size:calc(var(--u) * 1); font-weight:700; border-radius:calc(var(--u) * .7); padding:calc(var(--u) * .45) calc(var(--u) * .8); }
.tv-fo.sem { color:#FF4D5A; background:rgba(255,77,90,.14); } .tv-fo.reposto { color:#FFC21A; background:rgba(255,194,26,.14); }
.tv-duo { display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u) * .8); }
.tv-p { background:rgba(5,12,32,.45); border:1.5px solid rgba(43,208,127,.45); border-radius:calc(var(--u) * 1); padding:calc(var(--u) * .7) calc(var(--u) * .9); display:flex; flex-direction:column; gap:calc(var(--u) * .35); }
.tv-p.zero { border-color:rgba(255,77,90,.6); }
.tv-p-n { font-family:var(--f-display); font-size:calc(var(--u) * 1.55); font-weight:800; color:#4D8DFF; line-height:1.05; }
.tv-p-me { display:flex; align-items:baseline; gap:calc(var(--u) * .5); }
.tv-p-me b { font-family:var(--f-display); font-size:calc(var(--u) * 4.4); font-weight:800; line-height:1; color:#2BD07F; }
.tv-p.zero .tv-p-me b { color:#FF4D5A; }
.tv-p-me span { font-size:calc(var(--u) * 1); color:#C2CCDF; }
.tv-p-l { display:flex; justify-content:space-between; gap:calc(var(--u) * .5); font-size:calc(var(--u) * .95); color:#8391AD; border-top:1px solid rgba(86,130,255,.2); padding-top:calc(var(--u) * .3); }
.tv-p-l b { font-family:var(--f-display); font-size:calc(var(--u) * 1.35); color:#fff; }
.tv-p-l.c b { color:#4D8DFF; }
.tv-p-fo { font-size:calc(var(--u) * .85); font-weight:700; } .tv-p-fo.sem { color:#FF4D5A; } .tv-p-fo.rep { color:#FFC21A; }
.tv-sub { font-family:var(--f-display); font-size:calc(var(--u) * 1); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#C2CCDF; }
.tv-bars { flex:1; min-height:calc(var(--u) * 7); display:flex; align-items:flex-end; gap:calc(var(--u) * .5); }
.tv-b { flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:0; }
.tv-b b { font-family:var(--f-display); font-size:calc(var(--u) * 1.35); color:#2BD07F; } .tv-b b.zero { color:#FF4D5A; }
.tv-b i { display:block; width:70%; min-height:3px; border-radius:calc(var(--u) * .4) calc(var(--u) * .4) 0 0; background:linear-gradient(180deg, #2BD07F, #128a52); }
.tv-b span { font-size:calc(var(--u) * .72); color:#8391AD; text-align:center; line-height:1.15; margin-top:calc(var(--u) * .25); white-space:nowrap; }
.tv-tot { font-size:calc(var(--u) * 1.05); color:#C2CCDF; border-top:1px solid rgba(86,130,255,.25); padding-top:calc(var(--u) * .5); }
.tv-tot b, .tv-prev b { font-family:var(--f-display); font-size:calc(var(--u) * 1.3); }
.tv-tot .g, .tv-prev .g { color:#2BD07F; }
.tv-prev { font-size:calc(var(--u) * .9); color:#8391AD; }
.tv-rt { display:grid; grid-template-columns:calc(var(--u) * 2.6) minmax(0,2.2fr) repeat(4, minmax(0,1fr)); align-items:center; gap:calc(var(--u) * .4); padding:calc(var(--u) * .55) calc(var(--u) * .4); border-top:1px solid rgba(86,130,255,.2); font-family:var(--f-display); font-size:calc(var(--u) * 1.9); font-weight:700; text-align:center; }
.tv-rt.tv-rh { border-top:0; font-family:var(--font); font-size:calc(var(--u) * .85); font-weight:600; color:#8391AD; padding-bottom:0; }
.tv-rt .pos { font-size:calc(var(--u) * 1.7); }
.tv-rt .nm { text-align:left; font-size:calc(var(--u) * 1.4); color:#fff; line-height:1.05; min-width:0; white-space:normal; word-break:keep-all; overflow-wrap:normal; }
.tv-rt .nm small { display:block; font-family:var(--font); font-size:calc(var(--u) * .78); font-weight:500; color:#8391AD; }
.tv-rt.lead .nm { color:#4D8DFF; }
.tv-rt .me { color:#2BD07F; } .tv-rh .me { color:#2BD07F; }
.tv-rt span.top { background:linear-gradient(180deg,#FFD24D,#E0A800); color:#2A1C00; border-radius:calc(var(--u) * .5); }
.tv-rt.tv-rtot { font-size:calc(var(--u) * 1.4); color:#C2CCDF; border-top:1.5px solid rgba(86,130,255,.4); }
.tv-rt.tv-rtot span:nth-child(2) { text-align:left; }
.tv-leg { margin-top:auto; font-size:calc(var(--u) * .78); color:#8391AD; display:flex; align-items:center; gap:calc(var(--u) * .4); }
.tv-leg i { display:inline-block; width:calc(var(--u) * 1.4); height:calc(var(--u) * .9); border-radius:4px; background:linear-gradient(180deg,#FFD24D,#E0A800); }
.tvm-foot { display:flex; gap:calc(var(--u) * 1.2); align-items:center; overflow:hidden; white-space:nowrap; padding:calc(var(--u) * .6) calc(var(--u) * 1.6); background:#07102A; border-top:1px solid rgba(86,130,255,.25); font-size:calc(var(--u) * .95); color:#C2CCDF; }
.tvf-l { font-family:var(--f-display); font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#FFC21A; }
.tvf-i b { color:#4D8DFF; font-family:var(--f-display); }
.tvf-i em { font-style:normal; font-weight:700; color:#2BD07F; } .tvf-i em.zero { color:#FF4D5A; }
.tvf-i + .tvf-i::before { content:'•'; margin-right:calc(var(--u) * 1.2); color:#4a5a80; }
.tvm-fs { position:absolute; left:50%; top:calc(var(--u) * 7.2); transform:translateX(-50%); background:rgba(20,99,255,.9); color:#fff; padding:calc(var(--u) * .6) calc(var(--u) * 1.4); border-radius:99px; font-size:calc(var(--u) * 1); font-weight:700; pointer-events:none; }
.tvm-fs[hidden] { display:none; }
.tvm-exit { position:absolute; right:calc(var(--u) * .8); bottom:calc(var(--u) * 3.2); opacity:.15; border:1px solid rgba(255,255,255,.3); background:#0B1630; color:#fff; border-radius:8px; padding:6px 12px; font-family:var(--f-display); font-size:14px; cursor:pointer; transition:opacity .2s; }
.tvm-exit:hover { opacity:1; }
@media(max-aspect-ratio:1/1){ .tvm-main { grid-template-columns:1fr; overflow-y:auto; } .tvm { overflow-y:auto; } }


.tv-atual { border-color:rgba(255,138,61,.55); box-shadow:inset 0 0 0 1px rgba(255,138,61,.15); }
.tv-atual h2 span { color:#FFB27A; }
.tv-p-me small { font-size:calc(var(--u) * .8); color:#8391AD; }
.tv-race { display:flex; flex-direction:column; gap:calc(var(--u) * .5); }
.tv-rr { display:grid; grid-template-columns:calc(var(--u) * 9.5) 1fr calc(var(--u) * 3.6); align-items:center; gap:calc(var(--u) * .6); }
.tv-rr .l { font-family:var(--f-display); font-weight:700; font-size:calc(var(--u) * 1.15); line-height:1.05; }
.tv-rr .l small { display:block; font-family:var(--font); font-weight:500; font-size:calc(var(--u) * .75); color:#8391AD; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tv-rr .tr { position:relative; height:calc(var(--u) * 1.6); background:rgba(86,130,255,.15); border-radius:99px; overflow:hidden; }
.tv-rr .tr i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; }
.tv-rr.now .tr i { background:linear-gradient(90deg, #FF8A3D, #FFC21A); z-index:2; }
.tv-rr.now .tr i.proj { background:repeating-linear-gradient(-45deg, rgba(255,194,26,.35) 0 6px, transparent 6px 12px); z-index:1; }
.tv-rr.ref .tr i { background:linear-gradient(90deg, #128a52, #2BD07F); }
.tv-rr b { font-family:var(--f-display); font-size:calc(var(--u) * 2.3); text-align:right; }
.tv-rr.now b { color:#FFC21A; } .tv-rr.ref b { color:#2BD07F; }
.tv-proj { display:flex; flex-direction:column; gap:calc(var(--u) * .35); font-size:calc(var(--u) * 1.05); color:#DDE6F7; background:rgba(5,12,32,.45); border:1px solid rgba(86,130,255,.25); border-radius:calc(var(--u) * .8); padding:calc(var(--u) * .6) calc(var(--u) * .8); }
.tv-proj b { font-family:var(--f-display); font-size:calc(var(--u) * 1.3); }
.tv-proj b.y { color:#FFC21A; } .tv-proj b.g { color:#2BD07F; }
.tv-race2 { gap:calc(var(--u) * .3); padding-top:calc(var(--u) * .2); }
.tv-sub2 { font-family:var(--f-display); font-size:calc(var(--u) * .85); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8391AD; }
.tv-race2 .tv-rr { grid-template-columns:calc(var(--u) * 4.5) 1fr calc(var(--u) * 3.6); }
.tv-race2 .tv-rr .l { font-size:calc(var(--u) * .95); color:#C2CCDF; }
.tv-race2 .tv-rr .tr { height:calc(var(--u) * .9); }
.tv-race2 .tv-rr b { font-size:calc(var(--u) * 1.6); }
.tv-race2 .tv-rr.now .tr i { background:linear-gradient(90deg, #1463FF, #4D8DFF); }
.tv-race2 .tv-rr.now .tr i.proj { background:repeating-linear-gradient(-45deg, rgba(77,141,255,.35) 0 6px, transparent 6px 12px); }
.tv-race2 .tv-rr.ref .tr i { background:#8391AD; }
.tv-race2 .tv-rr.now b { color:#4D8DFF; } .tv-race2 .tv-rr.ref b { color:#C2CCDF; }
.tv-p2 { font-size:calc(var(--u) * .85); color:#8391AD; } .tv-p2 b { color:#4D8DFF; font-family:var(--f-display); font-size:calc(var(--u) * 1.1); }
.tv-last { margin-top:auto; font-size:calc(var(--u) * .9); color:#8391AD; border-top:1px solid rgba(86,130,255,.25); padding-top:calc(var(--u) * .5); }
.tv-last b { color:#4D8DFF; font-family:var(--f-display); }
/* letras maiores para ler de longe: ranking e dias sem incidente */
.tv-rt { font-size:calc(var(--u) * 2.35) !important; padding:calc(var(--u) * .7) calc(var(--u) * .4) !important; }
.tv-rt .nm { font-size:calc(var(--u) * 1.75) !important; }
.tv-rt .nm small { font-size:calc(var(--u) * .95) !important; }
.tv-rt.tv-rh { font-size:calc(var(--u) * 1.05) !important; }
.tv-rt .pos { font-size:calc(var(--u) * 2.1) !important; }
.tv-rt.tv-rtot { font-size:calc(var(--u) * 1.8) !important; }
.tv-leg { font-size:calc(var(--u) * .95) !important; }
.tvm-safe b { font-size:calc(var(--u) * 4.4) !important; }
.tvm-safe span { font-size:calc(var(--u) * 1.15) !important; }
.tvm-safe .ico { font-size:calc(var(--u) * 2.6) !important; }


.tv-prox { border-color:rgba(43,208,127,.6); box-shadow:inset 0 0 0 1px rgba(43,208,127,.15); }
.tv-prox h2 span { color:#7EE8B5; }
.tv-prox-n { text-align:center; padding:calc(var(--u) * .4) 0; }
.tv-prox-n small { display:block; font-family:var(--f-display); font-size:calc(var(--u) * 1.3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#FFC21A; }
.tv-prox-n b { display:block; font-family:var(--f-display); font-size:calc(var(--u) * 2.5); font-weight:800; line-height:1.05; color:#4D8DFF; }
.tv-meta { align-items:center; text-align:center; }
.tv-meta-n { display:flex; align-items:center; justify-content:center; gap:calc(var(--u) * .8); }
.tv-meta-n > b { font-family:var(--f-display); font-size:calc(var(--u) * 5) !important; line-height:1; }
.tv-meta-n span { text-align:left; font-size:calc(var(--u) * 1.05); line-height:1.3; }


/* cena 3D da doca no espaço livre do ranking (só enfeite: some se faltar espaço para os números) */
.tv-3d { flex:1 1 0; min-height:0; position:relative; border-radius:calc(var(--u) * .9); overflow:hidden; background:#0b1630; }
.tv-3d.c3d-vazio { visibility:hidden; }
.tv-3d .c3d { position:absolute; inset:0; background:center / cover no-repeat; }
.tv-3d canvas, .tv-3d img { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; }
.tv-3d::after { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit; box-shadow:inset 0 0 calc(var(--u) * 1.4) calc(var(--u) * .35) #0A1430, inset 0 0 0 1px rgba(86,130,255,.2); }
@media(max-aspect-ratio:1/1){ .tv-3d { flex:none; aspect-ratio:2.4 / 1; } }


/* ícones de linha e posições do painel (sem emojis) */
.tvi { width:1em; height:1em; flex:none; vertical-align:-0.14em; margin-right:.35em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:#A9AFBA; }
.tvc h2 .tvi { color:#E5A50A; }
.tvc h2 { justify-content:flex-start !important; }
.tvc h2 > span { margin-left:auto; }

<script>
/* Cena 3D da doca (o mesmo arquivo tv/cena3d.js do app) */
/* ═══════════════════════════════════════════════════════════════════════════
   CENA 3D DA DOCA · Shift Flow · Painel da Expedição (Ball Três Rios)
   Empilhadeira de contrapeso (5 t) com operador leva um pallet de latas até a
   porta da carreta baú (ela nunca entra no baú) e sai de ré; o motorista encosta
   a armação de alumínio na carga e empurra o pallet para dentro. Ciclo de 16 s.
   A cada 2 carregamentos, um "Momento Segurança": a cena desacelera até parar, a
   câmera faz um close no assunto e aparece uma regra de segurança; depois segue.
   A cada 5 carregamentos, a finalização: carreta completa, big bag inflado pelo
   auxiliar na escada com guarda-corpo, porta rápida fechada, nota fiscal e chave
   com o conferente, trava-rodas retirado; o caminhão adianta um pouco, o motorista
   fecha as duas portas do baú, coloca o lacre e então sai da doca.

   · Three.js (WebGL), carregado só quando o painel abre; nada de vídeo.
   · Tudo modelado em código, em metros, com dimensões reais.
   · Independente dos dados: não lê nem altera nenhum número do painel.
   · Até 30 quadros/s; pausa com a aba oculta ou o painel fechado;
     baixa a qualidade sozinha em aparelho fraco; sem WebGL mostra uma imagem.

   Uso:  Cena3D.montar(elementoDaFaixa, { fallback: 'url-da-imagem' })
   (pode chamar de novo a cada atualização do painel: a cena é reaproveitada)
   ═══════════════════════════════════════════════════════════════════════════ */

  function webglOk() {

  function mostrarImagem() {

    host.classList.add('c3d-img');
    if (fallbackUrl && !host.querySelector('img')) { const i = new Image(); i.alt = ''; i.src = fallbackUrl; host.appendChild(i); }

  function montar(slot, opts) {

    if (!host) { host = document.createElement('div'); host.className = 'c3d'; host.setAttribute('aria-hidden', 'true'); }
    if (host.parentNode !== slot) slot.appendChild(host);
    if (fallbackUrl && estado !== 'ok') host.style.backgroundImage = 'url("' + fallbackUrl + '")';   // imagem enquanto a cena carrega
    if (estado !== 'novo') { api && api.resize(); return; }
    const reduzir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!webglOk()) { estado = 'imagem'; mostrarImagem(); return; }
    estado = 'carregando';
    import(THREE_URL).then(T => {
      try { api = construir(T, host, { parado: reduzir }); estado = 'ok'; host.style.backgroundImage = ''; }
      catch (e) { console.warn('[cena3d]', e); estado = 'imagem'; mostrarImagem(); }
    }).catch(() => { estado = 'imagem'; mostrarImagem(); });
  }

      const fx = opts.lado || 1;
      add(cil(rAro * 0.86, rAro * 0.86, 0.01, 24, 'z'), opts.matDisco || MT.aco, g, 0, 0, fx * larg * 0.47);
      add(cil(rAro * 0.32, rAro * 0.38, 0.07, 16, 'z'), opts.matCubo || MT.cromo, g, 0, 0, fx * (larg * 0.47 + 0.03));
      const nP = opts.parafusos || 8;
      for (let i = 0; i < nP; i++) { const a = i / nP * Math.PI * 2; add(cil(0.012, 0.012, 0.03, 6, 'z'), MT.cromo, g, Math.cos(a) * rAro * 0.52, Math.sin(a) * rAro * 0.52, fx * (larg * 0.47 + 0.012), false); }
      if (opts.furos) for (let i = 0; i < 6; i++) { const a = (i + 0.5) / 6 * Math.PI * 2; add(cil(rAro * 0.12, rAro * 0.12, 0.012, 10, 'z'), MT.preto, g, Math.cos(a) * rAro * 0.7, Math.sin(a) * rAro * 0.7, fx * larg * 0.475, false); }
      return g;
    }

    const cena = new THREE.Group(); scene.add(cena);
    const PISO = 0, CHAO = -1.25;      // piso da doca = piso da carreta · pátio 1,25 m abaixo

    // ═════════════ DOCA, GALPÃO E PÁTIO ═════════════
    const amb = new THREE.Group(); cena.add(amb);
    {
      // pátio (asfalto) com faixas de manobra
      const asf = add(new THREE.PlaneGeometry(120, 80), MT.asfalto, amb, -40, CHAO, 0, false); asf.rotation.x = -Math.PI / 2;
      for (const z of [-2.1, 2.1, -6.3]) { const f = add(new THREE.PlaneGeometry(22, 0.12), MT.amareloPiso, amb, -11, CHAO + 0.005, z, false); f.rotation.x = -Math.PI / 2; }
      // plataforma de concreto
      const plat = add(caixa(18, 1.25, 13), MT.concretoLat, amb, 9.15, CHAO / 2, -0.5);
      plat.receiveShadow = true;
      const topo = add(new THREE.PlaneGeometry(18, 13), MT.concreto, amb, 9.15, PISO + 0.002, -0.5, false); topo.rotation.x = -Math.PI / 2;
      T.concreto.repeat.set(4.5, 3.2);
      // faixa zebrada na borda e faixa amarela de pedestre
      for (const [z0, z1] of [[-6.95, -5.3], [-3.1, -1.1], [1.1, 5.7]]) {
        const tz = T.zebra.clone(); tz.needsUpdate = true; tz.repeat.set((z1 - z0) / 0.5, 1);
        const f = add(new THREE.PlaneGeometry(z1 - z0, 0.25), std({ map: tz, roughness: 0.6 }), amb, 0.3, PISO + 0.004, (z0 + z1) / 2, false); f.rotation.x = -Math.PI / 2; f.rotation.z = Math.PI / 2;
      }
      for (const z of [3.2]) { const f = add(new THREE.PlaneGeometry(14, 0.1), MT.amareloPiso, amb, 8.5, PISO + 0.004, z, false); f.rotation.x = -Math.PI / 2; }
      // niveladores de doca (chapa xadrez) com lábio sobre o piso da carreta
      for (const z of [0, -4.2]) {
        add(caixa(1.9, 0.04, 2.1), MT.chapa, amb, 1.1, PISO - 0.015, z, false);
        const labio = add(caixa(0.27, 0.025, 2.1), MT.chapa, amb, 0.015, PISO + 0.012, z, false); labio.rotation.z = -0.03;
        // batentes de borracha
        for (const s of [-1, 1]) { add(cxR(0.14, 0.42, 0.26, 0.02), MT.preto, amb, 0.08, -0.33, z + s * 1.18); add(caixa(0.02, 0.5, 0.36), MT.aco, amb, 0.155, -0.33, z + s * 1.18); }
      }
      // parede do galpão ao fundo, com portas de enrolar e janelas altas
      const pw = add(caixa(30, 8.5, 0.3), MT.parede, amb, 14.6, 4.0, -7.0); pw.material = MT.parede; T.parede.repeat.set(12, 1);
      for (const x of [17.5, 22.0]) {
        add(caixa(3.4, 4.2, 0.08), std({ color: 0x9aa3ad, metalness: 0.6, roughness: 0.4 }), amb, x, 2.1, -6.82);
        for (let y = 0.3; y < 4.2; y += 0.28) add(caixa(3.4, 0.02, 0.02), MT.aco, amb, x, y, -6.77, false);
        add(caixa(3.7, 0.18, 0.2), MT.amareloPiso, amb, x, 4.3, -6.78);
      }
      for (let x = 2; x < 28; x += 3.2) add(caixa(2.2, 0.7, 0.05), std({ color: 0x1a2a44, emissive: 0x2a3f66, emissiveIntensity: 0.6, roughness: 0.1, metalness: 0.4 }), amb, x, 6.6, -6.83, false);
      // cobertura metálica sobre a plataforma, com luminárias LED
      add(caixa(32, 0.25, 11), MT.grafite, amb, 13, 7.0, -1.6, false);
      for (let x = -1.5; x < 28; x += 4) for (const z of [-4.5, -0.5, 3.0]) add(caixa(1.3, 0.06, 0.32), MT.luzTeto, amb, x, 6.84, z, false);
      // pilares de concreto atrás (longe da câmera)
      for (const x of [3.2, 9.2, 15.2]) add(caixa(0.4, 7, 0.4), MT.concretoLat, amb, x, 3.5, -6.6);
      // postes de luz do pátio (ao longe)
      for (const [x, z] of [[-16, 9], [-34, 9], [-26, -11]]) {
        add(cil(0.08, 0.12, 10, 8), MT.grafite, amb, x, CHAO + 5, z, false);
        add(caixa(0.9, 0.12, 0.35), MT.luzPoste, amb, x + 0.4, CHAO + 10, z, false);
      }
      // cerca e silhueta de vegetação ao fundo
      const cerca = std({ color: 0x232b38, roughness: 0.9 });
      add(caixa(0.05, 2.2, 60), cerca, amb, -48, CHAO + 1.1, 0, false);
      for (let i = 0; i < 18; i++) { const r = 2 + rnd() * 2.5; add(new THREE.SphereGeometry(r, 10, 8), std({ color: 0x0f1a14, roughness: 1 }), amb, -54 - rnd() * 6, CHAO + r * 0.9, -30 + i * 3.6, false); }
    }

    // ═════════════ CARRETA BAÚ (3 eixos) ═════════════
    const COMP = 14.8, LARG = 2.6, ALT_INT = 2.7;
    function carreta(abertas, semCavalo, rodasSoltas) {
      const g = new THREE.Group();
      const x0 = 0, x1 = -COMP, xm = (x0 + x1) / 2;
      const esp = 0.05, h = ALT_INT + 0.12;
      // laterais (montantes na textura), teto e frente
      for (const s of [-1, 1]) {
        const lat = add(caixa(COMP - 0.16, h, esp), MT.bau, g, xm - 0.08, h / 2, s * (LARG / 2 - esp / 2));
        if (s < 0) lat.material = MT.bauLiso;
        // longarinas superior e inferior
        add(caixa(COMP, 0.1, 0.07), MT.aluminio, g, xm, h - 0.05, s * (LARG / 2 + 0.005));
        add(caixa(COMP, 0.16, 0.09), MT.aluminio, g, xm, -0.02, s * (LARG / 2 + 0.01));
        // faixa refletiva (padrão brasileiro)
        const f = add(new THREE.PlaneGeometry(COMP - 0.6, 0.05), MT.faixa, g, xm, 0.1, s * (LARG / 2 + 0.002), false); if (s < 0) f.rotation.y = Math.PI;
        T.faixa.repeat.set(30, 1);
        // revestimento interno
        add(caixa(COMP - 0.2, ALT_INT, 0.02), MT.interior, g, xm - 0.1, ALT_INT / 2, s * (LARG / 2 - esp - 0.01), false);
      }
      add(caixa(COMP, 0.06, LARG), MT.bauLiso, g, xm, h + 0.0, 0);
      add(caixa(COMP - 0.2, 0.02, LARG - 0.12), MT.interior, g, xm - 0.1, ALT_INT, 0, false);
      add(caixa(0.06, h, LARG), MT.bauLiso, g, x1 + 0.03, h / 2, 0);
      // assoalho
      add(caixa(COMP - 0.1, 0.06, LARG - 0.1), MT.piso, g, xm - 0.05, -0.03, 0, false);
      // quadro traseiro (colunas e travessa) — a boca de carga
      for (const s of [-1, 1]) add(cxR(0.12, h + 0.05, 0.12, 0.01), MT.aluminio, g, -0.06, h / 2, s * (LARG / 2 - 0.06));
      add(cxR(0.12, 0.16, LARG, 0.01), MT.aluminio, g, -0.06, h - 0.02, 0);
      add(cxR(0.14, 0.14, LARG, 0.01), MT.aco, g, -0.07, -0.08, 0);
      // portas traseiras: abertas = giradas 270° e encostadas nas laterais
      for (const s of [-1, 1]) {
        const p = new THREE.Group(); g.add(p);
        const largP = LARG / 2 - 0.02;
        add(caixa(largP, h - 0.04, 0.05), MT.bauLiso, p, -largP / 2, h / 2, 0);
        for (const k of [0.22, 0.78]) { add(cil(0.016, 0.016, h - 0.1, 8), MT.cromo, p, -largP * k, h / 2, s * 0.04); for (const y of [0.4, 1.4, 2.4]) add(caixa(0.05, 0.04, 0.04), MT.cromo, p, -largP * k, y, s * 0.04, false); }
        for (const y of [0.3, 1.4, 2.5]) add(caixa(0.16, 0.06, 0.03), MT.aco, p, -0.06, y, s * 0.03, false);
        (g.userData.portas = g.userData.portas || []).push({ p, s }); if (rodasSoltas) p.userData.manter = true;
        if (abertas) p.position.set(0.0, 0, s * (LARG / 2 + 0.085));
        else { p.position.set(0.03, 0, s * (LARG / 2 - 0.02)); p.rotation.y = -s * Math.PI / 2; }
      }
      // chassi: longarinas, pino-rei, pés de apoio
      for (const s of [-0.45, 0.45]) add(caixa(11.7, 0.32, 0.12), MT.grafite, g, -6.15, -0.3, s);
      for (let x = -0.8; x > -12; x -= 1.2) add(caixa(0.08, 0.12, LARG - 0.2), MT.grafite, g, x, -0.12, 0, false);
      add(caixa(2.6, 0.04, 2.2), MT.aco, g, -13.4, -0.08, 0);
      const pe = semCavalo ? 1.12 : 0.85;
      for (const s of [-1, 1]) {
        add(caixa(0.12, pe, 0.12), MT.aco, g, -11.6, -0.175 - pe / 2, s * 0.95);
        add(caixa(0.3, 0.06, 0.3), MT.aco, g, -11.6, -0.2 - pe, s * 0.95);
        add(caixa(0.12, 0.12, 0.6), MT.preto, g, -11.6, -0.4, s * 0.8);
      }
      // para-choque traseiro (com faixa refletiva) e lanternas
      add(caixa(0.14, 0.16, LARG - 0.25), MT.aco, g, -0.25, -0.78, 0);
      const pf = add(new THREE.PlaneGeometry(LARG - 0.3, 0.1), MT.faixa, g, -0.17, -0.78, 0, false); pf.rotation.y = Math.PI / 2;
      for (const s of [-1, 1]) { add(caixa(0.12, 0.62, 0.08), MT.aco, g, -0.4, -0.45, s * 0.75); add(caixa(0.05, 0.08, 0.22), MT.lanterna, g, -0.16, -0.62, s * 0.95, false); add(caixa(0.05, 0.06, 0.1), MT.ambar, g, -0.16, -0.62, s * 0.75, false); }
      // eixos traseiros com rodado duplo
      const rodas = [];
      for (const ex of [-2.0, -3.32]) {
        add(cil(0.07, 0.07, LARG - 0.35, 10, 'z'), MT.grafite, g, ex, -0.73, 0);
        for (const s of [-1, 1]) for (const k of [0, 1]) {
          const r = pneu(0.53, 0.28, 0.29, MT.borracha, MT.aluminio, { lado: s, furos: true, parafusos: 10, matDisco: MT.aluminio });
          r.position.set(ex, CHAO + 0.53, s * (LARG / 2 - 0.16 - k * 0.3)); g.add(r); rodas.push(r); if (rodasSoltas) r.userData.manter = true;
        }
        // suspensão
        for (const s of [-1, 1]) add(caixa(1.0, 0.08, 0.1), MT.preto, g, ex, -0.55, s * 0.45);
      }
      // para-lamas e protetor lateral
      for (const s of [-1, 1]) {
        add(caixa(2.9, 0.04, 0.68), MT.preto, g, -2.66, -0.12, s * 1.0);
        add(caixa(0.02, 0.5, 0.62), MT.preto, g, -3.98, -0.48, s * 1.0);
        add(caixa(7.0, 0.11, 0.05), std({ color: 0xc8161e, roughness: 0.45, metalness: 0.3 }), g, -7.75, -0.58, s * 1.12); for (const x of [-4.6, -7.75, -10.9]) add(caixa(0.06, 0.42, 0.05), MT.preto, g, x, -0.36, s * 1.1);
      }
      // caixa de ferramentas e estepe
      add(cxR(0.8, 0.5, 0.5, 0.02), MT.preto, g, -7.2, -0.42, 0.95);
      const est = pneu(0.53, 0.28, 0.29, MT.pneuLiso, MT.aluminio, { lado: -1 }); est.rotation.x = Math.PI / 2; est.position.set(-9.6, -0.75, 0); g.add(est);
      // marca discreta na lateral visível
      const logo = add(new THREE.PlaneGeometry(5.6, 2.45), MT.ball, g, -7.2, 1.48, LARG / 2 + 0.006, false);
      logo.renderOrder = 2;
      g.userData.rodas = rodas;
      return g;
    }
    const car1 = carreta(true, false, true); cena.add(car1);
    const car2 = carreta(true, true); car2.position.z = -4.2; cena.add(car2);

    // ═════════════ CAVALO MECÂNICO (6x2, cabine avançada) ═════════════
    let cavalo;
    {
      const cv = new THREE.Group(); cena.add(cv); cavalo = cv;
      const y0 = CHAO;
      const xc = -17.6;    // centro da cabine
      // chassi
      for (const s of [-0.45, 0.45]) add(caixa(7.2, 0.28, 0.1), MT.grafite, cv, -15.3, y0 + 0.95, s);
      // quinta roda
      add(cxR(1.1, 0.12, 1.4, 0.03), MT.preto, cv, -13.4, y0 + 1.1, 0);
      // cabine
      // perfil lateral: frente quase reta, para-brisa inclinado e teto alto aerodinâmico
      const PC = [[-1.17, 1.28], [-1.2, 2.42], [-1.12, 2.62], [-0.98, 3.55], [-0.85, 3.72, -0.55, 3.98], [0.2, 4.12], [1.0, 4.12], [1.13, 4.05], [1.15, 3.6], [1.15, 1.28], [-1.17, 1.28]];
      add(perfil(PC.map(q => q.length === 4 ? [xc + q[0], y0 + q[1], xc + q[2], y0 + q[3]] : [xc + q[0], y0 + q[1]]), 2.48, 0.1), MT.branco, cv);
      // para-brisa inclinado, quebra-sol e painéis pretos dos cantos
      { const pb = add(caixa(0.04, 0.95, 2.18), MT.vidro, cv, xc - 1.075, y0 + 3.085, 0, false); pb.rotation.z = -0.15; }
      { const qs = add(caixa(0.32, 0.05, 2.3), MT.preto, cv, xc - 1.0, y0 + 3.66, 0); qs.rotation.z = 0.12; }
      for (const s of [-1, 1]) add(caixa(0.42, 1.25, 0.03), MT.preto, cv, xc - 0.98, y0 + 2.05, s * 1.245, false);
      for (const s of [-1, 1]) {
        if (s < 0) {
          const jan = add(new THREE.PlaneGeometry(0.9, 0.75), MT.vidro, cv, xc - 0.55, y0 + 3.1, s * 1.252, false); jan.rotation.y = Math.PI;
          add(caixa(1.25, 0.012, 0.012), MT.preto, cv, xc - 0.45, y0 + 1.72, s * 1.255, false);
          add(caixa(0.012, 1.95, 0.012), MT.preto, cv, xc + 0.18, y0 + 2.62, s * 1.255, false);
          add(caixa(0.18, 0.04, 0.03), MT.cromo, cv, xc + 0.02, y0 + 2.35, s * 1.27, false);
        } else {
          // vão da porta (aparece escuro quando a porta abre), banco e pega-mãos
          add(new THREE.PlaneGeometry(1.24, 2.1), std({ color: 0x15181d, roughness: 0.9 }), cv, xc - 0.43, y0 + 2.48, 1.253, false);
          add(caixa(0.5, 0.12, 0.5), MT.assento, cv, xc - 0.25, y0 + 2.05, 0.85, false);
          add(caixa(0.12, 0.6, 0.5), MT.assento, cv, xc + 0.05, y0 + 2.4, 0.85, false);
          haste([xc + 0.27, y0 + 1.6, 1.3], [xc + 0.27, y0 + 2.85, 1.3], 0.016, MT.cromo, cv, 8);
          haste([xc - 1.12, y0 + 1.8, 1.3], [xc - 1.12, y0 + 2.9, 1.3], 0.016, MT.cromo, cv, 8);
          for (const y of [1.6, 2.85]) haste([xc + 0.2, y0 + y, 1.26], [xc + 0.27, y0 + y, 1.3], 0.012, MT.cromo, cv, 6);
          for (const y of [1.8, 2.9]) haste([xc - 1.05, y0 + y, 1.26], [xc - 1.12, y0 + y, 1.3], 0.012, MT.cromo, cv, 6);
          // porta (dobradiça na frente; abre para fora)
          const pc = new THREE.Group(); pc.position.set(xc - 1.05, 0, 1.255); pc.userData.manter = true; cv.add(pc); cv.userData.porta = pc;
          add(caixa(1.24, 2.1, 0.05), MT.branco, pc, 0.62, y0 + 2.48, 0);
          add(new THREE.PlaneGeometry(0.85, 0.72), MT.vidro, pc, 0.52, y0 + 3.1, 0.027, false);
          add(caixa(0.2, 0.04, 0.03), MT.cromo, pc, 1.08, y0 + 1.78, 0.04, false);
          add(caixa(1.18, 0.012, 0.012), MT.preto, pc, 0.62, y0 + 2.62, 0.027, false);
        }
        // espelhos grandes
        haste([xc - 0.98, y0 + 3.35, s * 1.24], [xc - 1.22, y0 + 3.35, s * 1.5], 0.018, MT.preto, cv, 6);
        haste([xc - 0.98, y0 + 2.75, s * 1.24], [xc - 1.22, y0 + 2.8, s * 1.5], 0.014, MT.preto, cv, 6);
        add(cxR(0.12, 0.58, 0.22, 0.03), MT.preto, cv, xc - 1.24, y0 + 3.05, s * 1.55);
        add(new THREE.PlaneGeometry(0.16, 0.5), MT.vidro, cv, xc - 1.305, y0 + 3.06, s * 1.55, false).rotation.y = -Math.PI / 2;
        // degraus
        for (const y of [0.55, 0.95]) add(caixa(0.4, 0.04, 0.22), MT.aluminio, cv, xc - 0.65, y0 + y, s * 1.12, false);
        // para-lamas dianteiros
        add(cxR(1.25, 0.06, 0.4, 0.02), MT.preto, cv, -17.9, y0 + 1.15, s * 1.05);
      }
      // grade, faróis e para-choque
      add(cxR(0.06, 0.95, 1.7, 0.02), MT.preto, cv, xc - 1.205, y0 + 1.98, 0);
      for (let y = 1.62; y < 2.4; y += 0.11) add(caixa(0.05, 0.035, 1.55), MT.cromo, cv, xc - 1.24, y0 + y, 0, false);
      add(caixa(0.03, 0.1, 0.24), MT.cromo, cv, xc - 1.25, y0 + 2.48, 0, false);
      add(cxR(0.36, 0.44, 2.5, 0.06), MT.preto, cv, xc - 1.1, y0 + 1.16, 0);
      for (const s of [-1, 1]) { add(cxR(0.06, 0.16, 0.42, 0.02), MT.farol, cv, xc - 1.24, y0 + 1.5, s * 0.93, false); add(caixa(0.04, 0.03, 0.32), MT.ambar, cv, xc - 1.25, y0 + 1.6, s * 0.95, false); add(cil(0.04, 0.04, 0.03, 10, 'x'), MT.farol, cv, xc - 1.28, y0 + 1.08, s * 0.95, false); }
      for (const z of [-0.6, -0.3, 0, 0.3, 0.6]) add(caixa(0.06, 0.05, 0.08), MT.ambar, cv, xc - 0.5, y0 + 4.13, z, false);
      // tanque de combustível, tanques de ar, caixa de bateria
      add(cil(0.3, 0.3, 1.2, 20, 'x'), MT.aluminio, cv, -16.0, y0 + 0.75, 0.88);
      add(cil(0.12, 0.12, 0.9, 12, 'x'), MT.aco, cv, -16.0, y0 + 0.75, -0.75);
      add(cxR(0.7, 0.5, 0.5, 0.02), MT.preto, cv, -16.0, y0 + 0.8, -0.95);
      // escapamento vertical atrás da cabine
      add(cil(0.07, 0.07, 1.6, 10), MT.cromo, cv, -16.25, y0 + 3.4, 1.05);
      // rodas: dianteira e tandem
      const rodas = []; cv.userData.rodas = rodas;
      for (const [ex, dupla] of [[-17.9, false], [-14.0, true], [-12.7, true]]) {
        add(cil(0.07, 0.07, 2.0, 10, 'z'), MT.grafite, cv, ex, y0 + 0.52, 0);
        for (const s of [-1, 1]) for (let k = 0; k < (dupla ? 2 : 1); k++) {
          const r = pneu(0.52, 0.3, 0.29, MT.borracha, MT.aluminio, { lado: s, furos: true, parafusos: 10, matDisco: MT.aluminio });
          r.position.set(ex, y0 + 0.52, s * (1.05 - k * 0.32)); cv.add(r); rodas.push(r); r.userData.manter = true;
        }
        if (dupla) for (const s of [-1, 1]) add(caixa(1.0, 0.04, 0.72), MT.preto, cv, ex, y0 + 1.12, s * 0.9);
      }
    }

    // ═════════════ PALLET DE LATAS ═════════════
    const PL = 1.42, PW = 1.12, PH = 0.144;                       // pallet de latas: 1,42 × 1,12 m
    const LATA_D = 0.066, LATA_H = 0.122, CAMADAS = 15, SEP = 0.004;

function nums(regs) {
  const o = { pc:0, nsa:0, me:0, tampa:0, dev:0 };
  regs.forEach(r => {
    o.pc += r.p_c || 0; o.nsa += r.n_c || 0; o.me += r.p_d || 0;
    parse(r.tampa_entradas).forEach(e => o.tampa += parseInt(e.qtd) || 0);
    parse(r.devolucao_entradas).forEach(e => o.dev += parseInt(e.qtd) || 0);
  });
  return o;
}

// Rodada: dias seguidos (até 4) em que a mesma dupla trabalhou; o turno da noite
// registrado de madrugada conta para o dia em que começou. Última = a mais recente já terminada.
const diaTurno = r => { const d = new Date(+new Date(r.data_registro) - 7 * 3600e3); d.setHours(0, 0, 0, 0); return +d; };
function rodadas(regs) {
  const porConf = {};
  regs.forEach(r => (porConf[norm(r.conferente)] = porConf[norm(r.conferente)] || []).push(r));
  const cadeias = [];
  Object.entries(porConf).forEach(([k, rr]) => {
    const dias = [...new Set(rr.map(diaTurno))].sort((a, b) => b - a);
    let cur = null;
    dias.forEach(d => {
      if(cur && cur.dias.length < RODADA_DIAS && (cur.dias[cur.dias.length - 1] - d) / 86400000 <= 2) cur.dias.push(d);
      else { cur = { k, dias:[d] }; cadeias.push(cur); }
    });
  });
  cadeias.forEach(c => { c.ini = Math.min(...c.dias); c.fim = Math.max(...c.dias); });
  cadeias.sort((a, b) => b.fim - a.fim);
  const gs = [];
  cadeias.forEach(c => {
    const g = gs.find(g => c.ini <= g.fim && c.fim >= g.ini);
    if(g) { g.ini = Math.min(g.ini, c.ini); g.fim = Math.max(g.fim, c.fim); g.confs.add(c.k); g.maxDias = Math.max(g.maxDias, c.dias.length); }
    else gs.push({ ini:c.ini, fim:c.fim, confs:new Set([c.k]), maxDias:c.dias.length });
  });
  gs.forEach(g => {
    g.regs = regs.filter(r => g.confs.has(norm(r.conferente)) && diaTurno(r) >= g.ini && diaTurno(r) <= g.fim);
    g.ultimo = Math.max(...g.regs.map(r => +new Date(r.data_registro)));
    g.dias = Math.round((g.fim - g.ini) / 86400000) + 1;
  });
  gs.sort((a, b) => b.fim - a.fim);
  // terminada = 8 turnos registrados, ou já começou a rodada seguinte, ou 36 h sem registro
  gs.forEach((g, i) => { g.completa = i > 0 || g.regs.length >= RODADA_DIAS * 2 || (Date.now() - g.ultimo) > 36 * 3600e3; });
  return gs;
}
const nomesRodada = g => [...new Set([...g.regs].sort((a, b) => new Date(a.data_registro) - new Date(b.data_registro)).map(r => norm(r.conferente)))];

async function carregar() {
  try {
    const desde = new Date(Date.now() - 75 * 86400000).toISOString();
    const r = await fetch(`${SUPA_URL}/rest/v1/turnos?select=${COLUNAS}&data_registro=gte.${encodeURIComponent(desde)}&order=data_registro.desc&limit=1000`,
      { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }, cache: 'no-store' });
    if(!r.ok) throw new Error(r.status);
    TURNOS = (await r.json()).filter(x => x.turma_sai !== 'ADM');
    // nome mais completo visto para cada conferente
    NOMES = {}; TURNOS.forEach(x => { const k = norm(x.conferente); if(!NOMES[k] || String(x.conferente).length > NOMES[k].length) NOMES[k] = x.conferente; });
    ERRO = false;
  } catch(e) { ERRO = true; }
  render();
}

  {

  requestAnimationFrame(ajustar);
}

      <div class="tv-proj">

    </section>`;

// diminui a escala até tudo caber em 100% da tela, sem rolar
function ajustar() {
  const el = $('tvm'); el.style.setProperty('--k', '1');
  const sobra = () => el.scrollHeight > el.clientHeight + 1 || [...el.querySelectorAll('.tvc')].some(c => c.scrollHeight > c.clientHeight + 1);
  for(let k = 1, i = 0; i < 14 && sobra(); i++) { k -= 0.05; el.style.setProperty('--k', k.toFixed(2)); }
}

function relogio() {
  const d = new Date();
  $('tvm-hora').textContent = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  $('tvm-data').textContent = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}

// tela cheia no primeiro clique/tecla, cursor some parado, tela não apaga
const full = () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener('pointerdown', full); addEventListener('keydown', full);
const dica = () => { const d = $('tvm-fs'); d.hidden = !!document.fullscreenElement; clearTimeout(dica.t); if(!d.hidden) dica.t = setTimeout(() => d.hidden = true, 15000); };
document.addEventListener('fullscreenchange', () => { dica(); requestAnimationFrame(ajustar); });
let cur; addEventListener('mousemove', () => { $('tvm').classList.remove('nocursor'); clearTimeout(cur); cur = setTimeout(() => $('tvm').classList.add('nocursor'), 3000); });
let lock; async function acordado() { try { if(!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch(e) {} }
document.addEventListener('visibilitychange', () => { if(!document.hidden) { carregar(); acordado(); } });
addEventListener('resize', () => requestAnimationFrame(ajustar));
document.fonts?.ready.then(() => requestAnimationFrame(ajustar));

// Versão online do painel: o arquivo da pasta abre sempre a versão mais nova publicada.
// Se não tiver internet, continua com esta cópia local.
const ONLINE_URL = 'https://claudiogomes2016-cpu.github.io/shiftflow-br3r/tv/painel-tv.html';
if(location.protocol === 'file:') {
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
  fetch(ONLINE_URL + '?v=' + Date.now(), { cache: 'no-store', signal: ctl.signal }).then(r => { if(r.ok) location.replace(ONLINE_URL); }).catch(() => {});
} else {
  // já é a versão online: quando eu publicar uma melhoria, recarrega sozinha (verifica a cada 10 min)
  let base = null;
  const confere = async () => {
    try { const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text(); const h = t.length + ':' + t.slice(-400);
      if(base === null) base = h; else if(h !== base) location.reload(); } catch(e) {}
  };
  confere(); setInterval(confere, 10 * 60000);
}

relogio(); setInterval(relogio, 15000);
carregar(); setInterval(carregar, 60000);
setInterval(() => location.reload(), 6 * 3600000);   // recarrega a cada 6 h (limpa a memória da TV)
acordado(); dica();
</script>
