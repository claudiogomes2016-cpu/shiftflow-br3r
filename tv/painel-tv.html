<title>Shift Flow · Painel da Expedição (TV)</title>
<!--
  PAINEL DA TV — Shift Flow · Expedição BR3R
  Arquivo único: deixe na pasta da TV e abra com 2 cliques (precisa de internet).
  Mostra só números de produção: carregamentos, descarga de ME, tampa básica,
  devolução e dias sem incidente. NÃO busca Disciplina, relatos, faltas nem o
  cadastro de usuários. Atualiza os dados sozinho a cada 1 minuto.
  Tela cheia: clique uma vez na tela (ou aperte F11).
-->

<script>
/* Cena 3D da doca (o mesmo arquivo tv/cena3d.js do app) */
/* ═══════════════════════════════════════════════════════════════════════════
   CENA 3D DA DOCA · Shift Flow · Painel da Expedição (Ball Três Rios)
   Empilhadeira de contrapeso (5 t) com operador leva um pallet de latas até a
   porta da carreta baú (ela nunca entra no baú) e sai de ré; o motorista encosta
   a armação de alumínio na carga e empurra o pallet para dentro. Ciclo de 16 s.
   A cada 2 carregamentos, um "Momento Segurança": a cena desacelera até parar, a
   câmera faz um close no assunto e aparece uma regra de segurança; depois segue.

   · Three.js (WebGL), carregado só quando o painel abre; nada de vídeo.
   · Tudo modelado em código, em metros, com dimensões reais.
   · Independente dos dados: não lê nem altera nenhum número do painel.
   · Até 30 quadros/s; pausa com a aba oculta ou o painel fechado;
     baixa a qualidade sozinha em aparelho fraco; sem WebGL mostra uma imagem.

   Uso:  Cena3D.montar(elementoDaFaixa, { fallback: 'url-da-imagem' })
   (pode chamar de novo a cada atualização do painel: a cena é reaproveitada)
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  if (window.Cena3D) return;
  const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
  const CICLO = 16;          // segundos por ciclo
  const FPS = 30;

  let host = null, fallbackUrl = '', estado = 'novo', api = null;

  function webglOk() {
    try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
    catch (e) { return false; }
  }
  function mostrarImagem() {
    if (!host) return;
    host.classList.add('c3d-img');
    if (fallbackUrl && !host.querySelector('img')) { const i = new Image(); i.alt = ''; i.src = fallbackUrl; host.appendChild(i); }
    const cv = host.querySelector('canvas'); if (cv) cv.style.display = 'none';
  }

  function montar(slot, opts) {
    if (!slot) return;
    if (opts && opts.fallback) fallbackUrl = opts.fallback;
    if (!host) { host = document.createElement('div'); host.className = 'c3d'; host.setAttribute('aria-hidden', 'true'); }
    if (host.parentNode !== slot) slot.appendChild(host);
    if (fallbackUrl && estado !== 'ok') host.style.backgroundImage = 'url("' + fallbackUrl + '")';   // imagem enquanto a cena carrega
    if (estado !== 'novo') { api && api.resize(); return; }
    const reduzir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!webglOk()) { estado = 'imagem'; mostrarImagem(); return; }
    estado = 'carregando';
    import(THREE_URL).then(T => {
      try { api = construir(T, host, { parado: reduzir }); estado = 'ok'; host.style.backgroundImage = ''; }
      catch (e) { console.warn('[cena3d]', e); estado = 'imagem'; mostrarImagem(); }
    }).catch(() => { estado = 'imagem'; mostrarImagem(); });
  }
  window.Cena3D = { montar, imagem: mostrarImagem };

  // ── "Momento Segurança": regras mostradas em rodízio (fácil de trocar os textos) ──
  // t = instante do ciclo em que a cena para · obj = em quem a câmera foca (fk = empilhadeira,
  // pj = motorista, mundo = cenário) · pos/alvo = câmera no sistema desse objeto
  const MOMENTOS = [
    { t: 1.0, obj: 'mundo', pos: [-2.7, 0.15, 4.1], alvo: [-5.0, -1.65, 1.15], ico: '🛑', tit: 'Rodas bloqueadas antes de carregar', txt: 'Antes do carregamento, as rodas do caminhão devem estar <b>bloqueadas com trava-rodas (calços)</b>.' },
    { t: 4.9, obj: 'fk', pos: [0.8, 2.0, -3.2], alvo: [-0.6, 0.6, 0], ico: '📋', tit: 'Checklist antes de operar', txt: 'Faça a <b>inspeção pré-uso</b> e verifique a familiaridade com os <b>controles do equipamento</b>.' },
    { t: 3.4, obj: 'fk', pos: [-0.1, 2.2, -2.3], alvo: [-1.0, 1.5, 0], ico: '🦺', tit: 'Cinto afivelado, sempre', txt: 'A operação segura começa no assento: <b>cinto de segurança</b> e <b>EPIs completos</b>.' },
    { t: 2.2, obj: 'fk', pos: [3.3, 1.1, -2.9], alvo: [1.4, -0.15, 0], ico: '📦', tit: 'Carga baixa e inclinada para trás', txt: 'Transporte a carga <b>a cerca de 20 cm do chão</b> e <b>inclinada para trás</b>.' },
    { t: 4.5, obj: 'mundo', pos: [5.4, 2.4, -5.6], alvo: [1.4, -0.35, -1.2], ico: '🚧', tit: 'Motorista na faixa de demarcação', txt: 'Enquanto a empilhadeira carrega, o motorista fica <b>do lado de fora</b>, na faixa, em local <b>seguro e visível</b>.' },
    { t: 6.3, obj: 'fk', pos: [-3.6, 3.4, -7.0], alvo: [-2.3, 0.15, 0], ico: '👀', tit: 'Na ré, olhe para trás', txt: 'Confira o caminho livre antes de manobrar. <b>Blue spot</b> e alarme de ré funcionando.' },
    { t: 1.4, obj: 'fk', pos: [-3.5, 2.4, -4.0], alvo: [-0.5, 0.6, 0], ico: '📣', tit: 'Cruzamento: reduza e buzine', txt: 'Ao se aproximar de um cruzamento no armazém, <b>reduza a velocidade</b> e <b>buzine</b>.' },
    { t: 6.6, obj: 'mundo', pos: [6.5, 2.6, -5.6], alvo: [2.4, 0.3, -1.0], ico: '⚠️', tit: 'Fora da linha de fogo', txt: 'Auxiliares e pedestres sempre <b>fora da linha de fogo</b> da empilhadeira.' },
    { t: 3.2, obj: 'mundo', pos: [6.0, 2.4, -4.6], alvo: [2.0, 0.4, -0.6], ico: '✋', tit: 'Pedestre precisa se aproximar?', txt: '<b>Pare</b>, <b>abaixe os garfos</b>, desligue, desça e <b>afaste-se 1 metro</b> antes de permitir a aproximação.' },
    { t: 8.5, obj: 'mundo', pos: [-21.8, 1.5, 5.2], alvo: [-17.6, 0.7, 0.4], ico: '🔑', tit: 'Chave do caminhão com o conferente', txt: 'Entregue <b>antes do início</b> e devolvida somente após a <b>confirmação do término</b> do carregamento.' },
    { t: 4.95, obj: 'mundo', pos: [3.0, 1.5, 2.8], alvo: [0.1, -0.55, 0], ico: '🅿️', tit: 'Ao estacionar a empilhadeira', txt: '<b>Garfos no chão</b>, comandos em ponto morto, <b>freio acionado</b>, equipamento desligado e <b>chave retirada</b>.' },
    { t: 10.2, obj: 'mundo', pos: [2.7, 1.6, 1.25], alvo: [-1.2, 1.1, 0], ico: '🧤', tit: 'EPIs completos na doca', txt: 'Colete, óculos, luvas e calçado de segurança. Empurre a carga <b>sempre com a armação</b>.' },
    { t: 0.5, obj: 'mundo', pos: [5.4, 2.3, -6.6], alvo: [1.6, 0.3, -2.2], ico: '🎈', tit: 'Fixação com big bag inflável', txt: 'O motorista aguarda <b>fora do caminhão</b>, na faixa de demarcação, no <b>campo visual</b> do auxiliar, até a liberação.' },
  ];
  window.Cena3D.momentos = MOMENTOS;
  if (!document.getElementById('c3d-css')) {
    const st = document.createElement('style'); st.id = 'c3d-css';
    st.textContent = `
.c3d-msg { position:absolute; left:0; right:0; bottom:0; padding:calc(var(--c3du, 5px) * 5) calc(var(--c3du, 5px) * 3.2) calc(var(--c3du, 5px) * 2.6); display:flex; gap:calc(var(--c3du, 5px) * 2); align-items:center;
  background:linear-gradient(to top, rgba(5,11,26,.94) 0%, rgba(5,11,26,.78) 62%, rgba(5,11,26,0) 100%); color:#fff; font-family:'Barlow', system-ui, sans-serif;
  opacity:0; transform:translateY(12%); transition:opacity .6s ease, transform .6s ease; pointer-events:none; z-index:2; }
.c3d-msg.on { opacity:1; transform:none; }
.c3d-msg .ico { flex:none; width:calc(var(--c3du, 5px) * 8.6); height:calc(var(--c3du, 5px) * 8.6); border-radius:50%; display:grid; place-items:center; font-size:calc(var(--c3du, 5px) * 4.6);
  background:radial-gradient(circle at 35% 30%, #FFD54A, #E0A800); box-shadow:0 0 0 calc(var(--c3du, 5px) * .5) rgba(255,194,26,.25); }
.c3d-msg small { display:block; font-family:'Barlow Semi Condensed', 'Barlow', sans-serif; font-weight:800; letter-spacing:.14em; font-size:calc(var(--c3du, 5px) * 2.2); color:#FFC21A; }
.c3d-msg strong { display:block; font-family:'Barlow Semi Condensed', 'Barlow', sans-serif; font-weight:800; font-size:calc(var(--c3du, 5px) * 4.3); line-height:1.05; margin:calc(var(--c3du, 5px) * .3) 0 calc(var(--c3du, 5px) * .5); }
.c3d-msg p { margin:0; font-size:calc(var(--c3du, 5px) * 2.75); line-height:1.25; color:#DDE6F7; }
.c3d-msg p b { color:#FFC21A; font-weight:700; }`;
    document.head.appendChild(st);
  }

  // ═════════════════════════════════════════════════════════════════════════
  function construir(THREE, host, cfg) {
    const nucleos = navigator.hardwareConcurrency || 4;
    const movel = /Android|iPhone|iPad|Mobile|SmartTV|Tizen|Web0S|BRAVIA|AFT/i.test(navigator.userAgent);
    let Q = (movel || nucleos <= 4) ? 0 : 1;           // 1 = qualidade alta · 0 = leve

    const canvas = document.createElement('canvas');
    host.appendChild(canvas);
    const msg = document.createElement('div'); msg.className = 'c3d-msg';
    msg.innerHTML = '<span class="ico"></span><div><small>MOMENTO SEGURANÇA</small><strong></strong><p></p></div>';
    host.appendChild(msg);
    function mostrarMsg(m) { msg.querySelector('.ico').textContent = m.ico; msg.querySelector('strong').textContent = m.tit; msg.querySelector('p').innerHTML = m.txt; }
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    // ═════════════ CARRETA BAÚ (3 eixos) ═════════════
    const COMP = 14.8, LARG = 2.6, ALT_INT = 2.7;
    function carreta(abertas, semCavalo) {
      const g = new THREE.Group();
      const x0 = 0, x1 = -COMP, xm = (x0 + x1) / 2;
      const esp = 0.05, h = ALT_INT + 0.12;

        if (s < 0) lat.material = MT.bauLiso;

        add(caixa(COMP, 0.16, 0.09), MT.aluminio, g, xm, -0.02, s * (LARG / 2 + 0.01));
        // faixa refletiva (padrão brasileiro)
        const f = add(new THREE.PlaneGeometry(COMP - 0.6, 0.05), MT.faixa, g, xm, 0.1, s * (LARG / 2 + 0.002), false); if (s < 0) f.rotation.y = Math.PI;
        T.faixa.repeat.set(30, 1);
        // revestimento interno
        add(caixa(COMP - 0.2, ALT_INT, 0.02), MT.interior, g, xm - 0.1, ALT_INT / 2, s * (LARG / 2 - esp - 0.01), false);
      }
      add(caixa(COMP, 0.06, LARG), MT.bauLiso, g, xm, h + 0.0, 0);
      add(caixa(COMP - 0.2, 0.02, LARG - 0.12), MT.interior, g, xm - 0.1, ALT_INT, 0, false);
      add(caixa(0.06, h, LARG), MT.bauLiso, g, x1 + 0.03, h / 2, 0);
      // assoalho
      add(caixa(COMP - 0.1, 0.06, LARG - 0.1), MT.piso, g, xm - 0.05, -0.03, 0, false);
      // quadro traseiro (colunas e travessa) — a boca de carga
      for (const s of [-1, 1]) add(cxR(0.12, h + 0.05, 0.12, 0.01), MT.aluminio, g, -0.06, h / 2, s * (LARG / 2 - 0.06));
      add(cxR(0.12, 0.16, LARG, 0.01), MT.aluminio, g, -0.06, h - 0.02, 0);
      add(cxR(0.14, 0.14, LARG, 0.01), MT.aco, g, -0.07, -0.08, 0);
      // portas traseiras: abertas = giradas 270° e encostadas nas laterais
      for (const s of [-1, 1]) {

        for (const k of [0.22, 0.78]) { add(cil(0.016, 0.016, h - 0.1, 8), MT.cromo, p, -largP * k, h / 2, s * 0.04); for (const y of [0.4, 1.4, 2.4]) add(caixa(0.05, 0.04, 0.04), MT.cromo, p, -largP * k, y, s * 0.04, false); }

      }
      // chassi: longarinas, pino-rei, pés de apoio
      for (const s of [-0.45, 0.45]) add(caixa(11.7, 0.32, 0.12), MT.grafite, g, -6.15, -0.3, s);
      for (let x = -0.8; x > -12; x -= 1.2) add(caixa(0.08, 0.12, LARG - 0.2), MT.grafite, g, x, -0.12, 0, false);
      add(caixa(2.6, 0.04, 2.2), MT.aco, g, -13.4, -0.08, 0);
      const pe = semCavalo ? 1.12 : 0.85;
      for (const s of [-1, 1]) {

        add(caixa(0.3, 0.06, 0.3), MT.aco, g, -11.6, -0.2 - pe, s * 0.95);
        add(caixa(0.12, 0.12, 0.6), MT.preto, g, -11.6, -0.4, s * 0.8);
      }
      // para-choque traseiro (com faixa refletiva) e lanternas
      add(caixa(0.14, 0.16, LARG - 0.25), MT.aco, g, -0.25, -0.78, 0);
      const pf = add(new THREE.PlaneGeometry(LARG - 0.3, 0.1), MT.faixa, g, -0.17, -0.78, 0, false); pf.rotation.y = Math.PI / 2;
      for (const s of [-1, 1]) { add(caixa(0.12, 0.62, 0.08), MT.aco, g, -0.4, -0.45, s * 0.75); add(caixa(0.05, 0.08, 0.22), MT.lanterna, g, -0.16, -0.62, s * 0.95, false); add(caixa(0.05, 0.06, 0.1), MT.ambar, g, -0.16, -0.62, s * 0.75, false); }
      // eixos traseiros com rodado duplo

          r.position.set(ex, CHAO + 0.53, s * (LARG / 2 - 0.16 - k * 0.3)); g.add(r); rodas.push(r);

    // ═════════════ CAVALO MECÂNICO (6x2, cabine avançada) ═════════════

    // ═════════════ PALLET DE LATAS ═════════════
    const PL = 1.42, PW = 1.12, PH = 0.144;                       // pallet de latas: 1,42 × 1,12 m
    const LATA_D = 0.066, LATA_H = 0.122, CAMADAS = 15, SEP = 0.004;
    const geoLata = (() => {                                       // perfil de lata 350 ml
      const r = LATA_D / 2, h = LATA_H;
      const p = [[0, 0.002], [r * 0.78, 0], [r * 0.95, 0.006], [r, 0.014], [r, h - 0.016], [r * 0.86, h - 0.004], [r * 0.84, h], [0, h]].map(v => new THREE.Vector2(v[0], v[1]));
      return new THREE.LatheGeometry(p, Q ? 12 : 8);

    function palletDeLatas(simples) {
      const g = new THREE.Group();
      if (simples) {
        const hT = PH + SEP + CAMADAS * (LATA_H + SEP) + 0.05;
        add(caixa(PL, PH, PW), MT.madeira, g, 0, PH / 2, 0);

      for (let i = 0; i < 7; i++) add(caixa(0.14, 0.022, PW), MT.madeira, g, -PL / 2 + 0.07 + i * (PL - 0.14) / 6, 0.133, 0);
      // camadas de latas (só as visíveis: a casca externa e a camada de cima) + folhas separadoras
      const pos = [];
      const nx = Math.floor(PL / LATA_D), dz = LATA_D * 0.866, nz = Math.floor((PW - LATA_D) / dz) + 1;
      const ox = -PL / 2 + LATA_D / 2 + (PL - nx * LATA_D) / 2, oz = -PW / 2 + LATA_D / 2 + (PW - LATA_D - (nz - 1) * dz) / 2;
      const passo = LATA_H + SEP;
      for (let c = 0; c < CAMADAS; c++) {
        const y = PH + SEP + c * passo;
        for (let j = 0; j < nz; j++) {
          const desl = (j % 2) * LATA_D / 2, n = nx - (j % 2);
          for (let i = 0; i < n; i++) {
            const borda = j === 0 || j === nz - 1 || i === 0 || i === n - 1 || c === CAMADAS - 1;
            if (borda) pos.push(ox + desl + i * LATA_D, y, oz + j * dz);
          }
        }
        add(caixa(PL - 0.004, SEP, PW - 0.004), MT.papelao, g, 0, y - SEP / 2, 0, false);
      }
      const n = pos.length / 3;
      const latas = new THREE.InstancedMesh(geoLata, MT.lata, n);
      const m4 = new THREE.Matrix4(), cor = new THREE.Color(), q = new THREE.Quaternion();
      for (let k = 0; k < n; k++) {

        m4.compose(new THREE.Vector3(pos[k * 3], pos[k * 3 + 1], pos[k * 3 + 2]), q, new THREE.Vector3(1, 1, 1));

      for (const x of [-0.36, 0.36]) {

      // filme stretch (transparente, com brilho)

      return g;

      for (let i = 0; i < 6; i++) add(caixa(0.36, 0.012, 0.02), MT.preto, fk, -2.08, 0.6 + i * 0.06, -0.69, false);
      add(caixa(1.6, 0.04, 0.985), MT.preto, fk, -1.0, 0.34, 0, false);
      // assoalho do operador

        const depois = tAnim % CICLO, gat = (m.t - FOLGA + CICLO) % CICLO;
        const passou = depois >= antes ? (antes < gat && depois >= gat) : (antes < gat || depois >= gat);
        if (ciclo >= ciclosAte && passou) { fase = 'entra'; tFase = 0; mostrarMsg(m); }
      } else {
        tFase += dt;
        if (fase === 'entra') { const u = Math.min(1, tFase / ENTRA); vel = 1 - suave(u); k = u; if (u >= 1) { fase = 'fica'; tFase = 0; msg.classList.add('on'); } }
        else if (fase === 'fica') { vel = 0; k = 1; if (tFase >= FICA) { fase = 'sai'; tFase = 0; msg.classList.remove('on'); } }
        else { const u = Math.min(1, tFase / SAI); vel = suave(u); k = 1 - u; if (u >= 1) { fase = 'normal'; iMom++; ciclosAte = Math.floor(tAnim / CICLO) + 2; } }
        tAnim += dt * vel;
      }
      posicionar(tAnim % CICLO);
      camera(fase === 'normal' ? 0 : k, m);
    }

    posicionar(0);
    renderer.compile(scene, cam);
    renderer.setAnimationLoop(laco);
    // ganchos para testes: quadro exato de um instante
    window.__cena3d = { quadro: (t) => { posicionar(t); camera(0); renderer.render(scene, cam); }, parar: () => { vivo = false; renderer.setAnimationLoop(null); }, renderer, scene, cam, fk,
      momento: (i) => { const m = MOMENTOS[i]; for (let x = Math.max(0, m.t - 1.5); x < m.t; x += 0.1) posicionar(x); posicionar(m.t); camera(1, m); mostrarMsg(m); msg.classList.add('on'); renderer.render(scene, cam); },
      semMomento: () => { msg.classList.remove('on'); camera(0); },
      avancar: (dt) => { avancar(dt); renderer.render(scene, cam); }, passo: (dt) => avancar(dt), estado: () => ({ fase, iMom, tAnim, msg: msg.classList.contains('on') }) };
    return { resize };
  }
})();

function nums(regs) {
  const o = { pc:0, nsa:0, me:0, tampa:0, dev:0 };
  regs.forEach(r => {
    o.pc += r.p_c || 0; o.nsa += r.n_c || 0; o.me += r.p_d || 0;
    parse(r.tampa_entradas).forEach(e => o.tampa += parseInt(e.qtd) || 0);
    parse(r.devolucao_entradas).forEach(e => o.dev += parseInt(e.qtd) || 0);
  });
  return o;
}

// Rodada: dias seguidos (até 4) em que a mesma dupla trabalhou; o turno da noite
// registrado de madrugada conta para o dia em que começou. Última = a mais recente já terminada.
const diaTurno = r => { const d = new Date(+new Date(r.data_registro) - 7 * 3600e3); d.setHours(0, 0, 0, 0); return +d; };
function rodadas(regs) {
  const porConf = {};
  regs.forEach(r => (porConf[norm(r.conferente)] = porConf[norm(r.conferente)] || []).push(r));
  const cadeias = [];
  Object.entries(porConf).forEach(([k, rr]) => {
    const dias = [...new Set(rr.map(diaTurno))].sort((a, b) => b - a);
    let cur = null;
    dias.forEach(d => {
      if(cur && cur.dias.length < RODADA_DIAS && (cur.dias[cur.dias.length - 1] - d) / 86400000 <= 2) cur.dias.push(d);
      else { cur = { k, dias:[d] }; cadeias.push(cur); }
    });
  });
  cadeias.forEach(c => { c.ini = Math.min(...c.dias); c.fim = Math.max(...c.dias); });
  cadeias.sort((a, b) => b.fim - a.fim);
  const gs = [];
  cadeias.forEach(c => {
    const g = gs.find(g => c.ini <= g.fim && c.fim >= g.ini);
    if(g) { g.ini = Math.min(g.ini, c.ini); g.fim = Math.max(g.fim, c.fim); g.confs.add(c.k); g.maxDias = Math.max(g.maxDias, c.dias.length); }
    else gs.push({ ini:c.ini, fim:c.fim, confs:new Set([c.k]), maxDias:c.dias.length });
  });
  gs.forEach(g => {
    g.regs = regs.filter(r => g.confs.has(norm(r.conferente)) && diaTurno(r) >= g.ini && diaTurno(r) <= g.fim);
    g.ultimo = Math.max(...g.regs.map(r => +new Date(r.data_registro)));
    g.dias = Math.round((g.fim - g.ini) / 86400000) + 1;
  });
  gs.sort((a, b) => b.fim - a.fim);
  // terminada = 8 turnos registrados, ou já começou a rodada seguinte, ou 36 h sem registro
  gs.forEach((g, i) => { g.completa = i > 0 || g.regs.length >= RODADA_DIAS * 2 || (Date.now() - g.ultimo) > 36 * 3600e3; });
  return gs;
}
const nomesRodada = g => [...new Set([...g.regs].sort((a, b) => new Date(a.data_registro) - new Date(b.data_registro)).map(r => norm(r.conferente)))];

async function carregar() {
  try {
    const desde = new Date(Date.now() - 75 * 86400000).toISOString();
    const r = await fetch(`${SUPA_URL}/rest/v1/turnos?select=${COLUNAS}&data_registro=gte.${encodeURIComponent(desde)}&order=data_registro.desc&limit=1000`,
      { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }, cache: 'no-store' });
    if(!r.ok) throw new Error(r.status);
    TURNOS = (await r.json()).filter(x => x.turma_sai !== 'ADM');
    // nome mais completo visto para cada conferente
    NOMES = {}; TURNOS.forEach(x => { const k = norm(x.conferente); if(!NOMES[k] || String(x.conferente).length > NOMES[k].length) NOMES[k] = x.conferente; });
    ERRO = false;
  } catch(e) { ERRO = true; }
  render();
}

  // último turno
  const r = regs[0], o = nums([r]);

  const i0 = new Date(agora.getFullYear(), agora.getMonth(), 1);
  const doMes = regs.filter(x => new Date(x.data_registro) >= i0), qm = nums(doMes), nm = Math.max(1, doMes.length);
  const cmp = (v, med) => v > med * 1.05 ? 'up' : v < med * 0.95 ? 'dn' : 'eq';
  const turno = `
    <section class="tvc tv-turno">
      <h2>🕘 Último turno</h2>
      <div class="tv-who"><b>${nome(r.conferente)}</b><span>Turma ${r.turma_sai || '?'} → ${r.turma_rec || '?'} · ${fd(new Date(r.data_registro))} às ${fh(new Date(r.data_registro))}${horas < 48 ? ' · há ' + horas + ' h' : ''}</span></div>
      <div class="tv-me ${o.me ? '' : 'zero'}"><b>${fmt(o.me)}</b><span>${car(o.me)} de <strong>ME</strong> descarregadas<small>folha · quadro de topo · palete</small></span></div>
      <div class="tv-g2">
        <div class="tv-t"><b>${fmt(o.pc)}</b><span>carregou na <strong>Planta</strong></span></div>
        <div class="tv-t p"><b>${fmt(o.nsa)}</b><span>carregou na <strong>NSA</strong></span></div>
        <div class="tv-t y"><b>${fmt(o.tampa)}</b><span><strong>Tampa básica</strong></span></div>
        <div class="tv-t v"><b>${fmt(o.dev)}</b><span><strong>Devolução</strong></span></div>
      </div>
      ${doMes.length ? `<div class="tv-mes">
        <div class="tv-sub">📊 ${MESES[agora.getMonth()]} até agora · média por turno</div>
        <div class="tv-mes-g">
          <div><span>ME</span><b class="g">${fmt(qm.me)}</b><em class="${cmp(o.me, qm.me / nm)}">${fmt1(qm.me / nm)}/turno</em></div>
          <div><span>Planta</span><b>${fmt(qm.pc)}</b><em class="${cmp(o.pc, qm.pc / nm)}">${fmt1(qm.pc / nm)}/turno</em></div>
          <div><span>NSA</span><b>${fmt(qm.nsa)}</b><em class="${cmp(o.nsa, qm.nsa / nm)}">${fmt1(qm.nsa / nm)}/turno</em></div>
        </div>
        <div class="tv-mes-n">${doMes.length} passagens de turno no mês · a cor mostra o último turno acima (verde) ou abaixo (vermelho) da média</div>
      </div>` : ''}
    </section>`;

  // rodada atual (em andamento) no lugar do "Último turno", com a meta da última rodada
  let atual = '';
  {
    const gsA = rodadas(regs), ga = gsA[0], ref = gsA.find(x => x.completa);
    if(ga && !ga.completa && ref && ref !== ga) {
      const porKa = {}; ga.regs.forEach(x => (porKa[norm(x.conferente)] = porKa[norm(x.conferente)] || []).push(x));
      const kA = nomesRodada(ga), kR = nomesRodada(ref);
      const uq = nums([r]);
      atual = tvAtualHTML({
        ini: new Date(ga.ini), dias: ga.dias, diasPrev: RODADA_DIAS, previstos: RODADA_DIAS * 2, turnos: ga.regs.length,
        pessoas: kA.filter(k => porKa[k]).map(k => Object.assign({ nome: nome(porKa[k][0].conferente), turnos: porKa[k].length }, nums(porKa[k]))),
        qa: nums(ga.regs), qr: nums(ref.regs),
        nomesAtual: kA.map(k => String(nome(k)).split(' ')[0]).join(' e '), nomesRef: kR.map(k => String(nome(k)).split(' ')[0]).join(' e '),
        ultimo: { nome: nome(r.conferente), turma: r.turma_sai || '?', quando: new Date(r.data_registro), me: uq.me, pc: uq.pc, nsa: uq.nsa },
      });
    } else if(ga && ga.completa && gsA[1] && Date.now() - ga.ultimo < 48 * 3600e3) {
      // rodada acabou e a próxima dupla ainda não registrou: desafio para quem está chegando
      const uq = nums([r]), sg = gsA[1];
      atual = tvProximaHTML({
        previstos: RODADA_DIAS * 2,
        nomes: nomesRodada(sg).map(k => nome(k)),
        seu: nums(sg.regs), seuIni: new Date(sg.ini), seuFim: new Date(sg.fim),
        ult: nums(ga.regs), ultIni: new Date(ga.ini), ultFim: new Date(ga.fim),
        ultNomes: nomesRodada(ga).map(k => String(nome(k)).split(' ')[0]).join(' e '),
        ultimo: { nome: nome(r.conferente), turma: r.turma_sai || '?', quando: new Date(r.data_registro), me: uq.me, pc: uq.pc, nsa: uq.nsa },
      });
    }
  }

  // última rodada
  const gs = rodadas(regs);
  const idx = Math.max(0, gs.findIndex(g => g.completa)), g = gs[idx];
  let rodada = '<section class="tvc"><h2>🔄 Última rodada</h2><div class="tvm-load">Sem rodada completa.</div></section>';
  if(g) {
    const porK = {}; g.regs.forEach(x => (porK[norm(x.conferente)] = porK[norm(x.conferente)] || []).push(x));
    const pessoas = nomesRodada(g).filter(k => porK[k]).map(k => Object.assign({ k, n: porK[k][0].conferente }, nums(porK[k])));
    const tot = nums(g.regs);
    const linhas = [...g.regs].sort((a, b) => new Date(a.data_registro) - new Date(b.data_registro));
    const mx = Math.max(1, ...linhas.map(x => x.p_d || 0));
    const prev = gs[idx + 1], pv = prev ? nums(prev.regs) : null;
    rodada = `
    <section class="tvc tv-rod">
      <h2>🔄 Última rodada <span>${fd(new Date(g.ini))}${g.fim !== g.ini ? ' a ' + fd(new Date(g.fim)) : ''} · ${g.dias} dias · ${g.regs.length} turnos</span></h2>
      <div class="tv-duo">
        ${pessoas.map(p => `<div class="tv-p ${p.me ? '' : 'zero'}">
          <div class="tv-p-n">${nome(p.n)}</div>
          <div class="tv-p-me"><b>${fmt(p.me)}</b><span>${car(p.me)} de ME</span></div>
          <div class="tv-p-l"><span>Tampa <b>${fmt(p.tampa)}</b></span><span>Devol. <b>${fmt(p.dev)}</b></span></div>
          <div class="tv-p-l c"><span>Planta <b>${fmt(p.pc)}</b></span><span>NSA <b>${fmt(p.nsa)}</b></span></div>
        </div>`).join('')}
      </div>
      <div class="tv-sub">📦 ME turno a turno</div>
      <div class="tv-bars">${linhas.map(x => `<div class="tv-b"><b class="${x.p_d ? '' : 'zero'}">${fmt(x.p_d || 0)}</b><i style="height:${(x.p_d || 0) / mx * 100}%"></i><span>${String(nome(x.conferente)).split(' ')[0].slice(0, 8)}<br>${fd(new Date(x.data_registro))}</span></div>`).join('')}</div>
      <div class="tv-tot">Total da rodada: <b class="g">ME ${fmt(tot.me)}</b> · Planta ${fmt(tot.pc)} · NSA ${fmt(tot.nsa)} · Tampa ${fmt(tot.tampa)} · Devol. ${fmt(tot.dev)}</div>
      ${prev ? `<div class="tv-prev">⏮ Rodada anterior (${fd(new Date(prev.ini))} a ${fd(new Date(prev.fim))} · ${nomesRodada(prev).map(k => String(nome(k)).split(' ')[0]).join(' e ')}): <b class="g">ME ${fmt(pv.me)}</b> · Planta ${fmt(pv.pc)} · NSA ${fmt(pv.nsa)}</div>` : ''}
    </section>`;
  }

  // ranking do mês
  const porK = {}; doMes.forEach(x => { const k = norm(x.conferente); if(k) (porK[k] = porK[k] || []).push(x); });
  const lin = Object.entries(porK).map(([k, rr]) => Object.assign({ k, n: rr[0].conferente, turnos: rr.length }, nums(rr))).sort((a, b) => b.me - a.me || b.pc - a.pc);
  const cols = ['me', 'pc', 'nsa', 'turnos'];
  const max = Object.fromEntries(cols.map(c => [c, Math.max(0, ...lin.map(x => x[c]))]));
  const top = (x, c) => lin.length > 1 && max[c] > 0 && x[c] === max[c] ? ' top' : '';
  const ranking = `
    <section class="tvc tv-rank">
      <h2>🏆 Ranking de ${MESES[agora.getMonth()]} <span>${doMes.length} passagens · parcial</span></h2>
      <div class="tv-rt tv-rh"><span></span><span>Conferente</span><span class="me">ME</span><span>Planta</span><span>NSA</span><span>Turnos</span></div>
      ${lin.map((x, i) => `<div class="tv-rt${i === 0 ? ' lead' : ''}">
        <span class="pos">${['🥇','🥈','🥉'][i] || (i + 1) + 'º'}</span>
        <span class="nm">${curto(x.n)}<small>${fmt1(x.me / Math.max(1, x.turnos))} ME/turno</small></span>
        <span class="me${top(x, 'me')}">${fmt(x.me)}</span><span class="${top(x, 'pc')}">${fmt(x.pc)}</span><span class="${top(x, 'nsa')}">${fmt(x.nsa)}</span><span class="${top(x, 'turnos')}">${fmt(x.turnos)}</span>
      </div>`).join('') || '<div class="tvm-load">Sem registros no mês.</div>'}
      <div class="tv-rt tv-rtot"><span></span><span>Total</span><span class="me">${fmt(qm.me)}</span><span>${fmt(qm.pc)}</span><span>${fmt(qm.nsa)}</span><span>${fmt(doMes.length)}</span></div>
      <div class="tv-3d"></div>
      <div class="tv-leg"><i></i> maior do mês em cada coluna · ME = folha · quadro de topo · palete</div>
    </section>`;

  main.innerHTML = (atual || turno) + rodada + ranking;
  if(window.Cena3D) Cena3D.montar(document.querySelector('#tvm-main .tv-3d'), { fallback: FALLBACK3D });
  $('tvm-foot').innerHTML = '<span class="tvf-l">Últimos turnos</span>' + regs.slice(0, 8).map(x => {
    const q = nums([x]);
    return `<span class="tvf-i"><b>${curto(x.conferente)}</b> ${x.turma_sai || ''} · ${fd(new Date(x.data_registro))} ${fh(new Date(x.data_registro))} · <em class="${q.me ? '' : 'zero'}">ME ${fmt(q.me)}</em> · Planta ${fmt(q.pc)} · NSA ${fmt(q.nsa)}</span>`;
  }).join('');
  requestAnimationFrame(ajustar);
}

// Card "Nova rodada" (o mesmo código do app)
const tvProximaHTML = (d) => {
    const fmt = v => Number(v).toLocaleString('pt-BR');
    const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR');
    const fd = x => x.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    const fh = x => String(x.getHours()).padStart(2, '0') + 'h' + String(x.getMinutes()).padStart(2, '0');
    const prev = d.previstos, meta = d.ult.me + 1, lidera = d.seu.me > d.ult.me;
    const w = v => Math.min(100, v / Math.max(1, d.ult.me, d.seu.me) * 100);
    const wp = v => Math.min(100, v / Math.max(1, d.ult.pc, d.seu.pc) * 100);
    return `
    <section class="tvc tv-atual tv-prox">
      <h2>🎯 Nova rodada <span>começa hoje · ${prev} turnos pela frente</span></h2>
      <div class="tv-prox-n"><small>É a vez de vocês!</small><b>${d.nomes.join(' e ')}</b></div>
      <div class="tv-sub">📦 Descarga de ME: rodada passada</div>
      <div class="tv-race">
        <div class="tv-rr ref"><span class="l">Vocês<small>${fd(d.seuIni)} a ${fd(d.seuFim)}</small></span><div class="tr"><i style="width:${w(d.seu.me)}%"></i></div><b>${fmt(d.seu.me)}</b></div>
        <div class="tv-rr now"><span class="l">${d.ultNomes}<small>${fd(d.ultIni)} a ${fd(d.ultFim)} · acabou agora</small></span><div class="tr"><i style="width:${w(d.ult.me)}%"></i></div><b>${fmt(d.ult.me)}</b></div>
      </div>
      <div class="tv-proj tv-meta">
        <div>${lidera ? `🏆 <b class="g">Vocês estão na frente!</b> Para continuar na frente de ${d.ultNomes}:` : `🔥 Para passar ${d.ultNomes}:`}</div>
        <div class="tv-meta-n"><b class="y">${fmt(meta)}</b><span>carretas de ME ou mais<br>nos ${prev} turnos · ≈ <b class="y">${fmt1(meta / prev)}</b> por turno</span></div>
      </div>
      <div class="tv-race tv-race2">
        <div class="tv-sub2">🚛 Carregamento na planta · rodada passada</div>
        <div class="tv-rr ref"><span class="l">Vocês</span><div class="tr"><i style="width:${wp(d.seu.pc)}%"></i></div><b>${fmt(d.seu.pc)}</b></div>
        <div class="tv-rr now"><span class="l">Eles</span><div class="tr"><i style="width:${wp(d.ult.pc)}%"></i></div><b>${fmt(d.ult.pc)}</b></div>
      </div>
      <div class="tv-last">🕘 Último registro: <b>${d.ultimo.nome}</b> · Turma ${d.ultimo.turma} · ${fd(d.ultimo.quando)} ${fh(d.ultimo.quando)} · ME ${fmt(d.ultimo.me)} · Planta ${fmt(d.ultimo.pc)} · NSA ${fmt(d.ultimo.nsa)}</div>
    </section>`;
  };

// Bloco "Rodada atual" (o mesmo código do app)
const tvAtualHTML = (d) => {
    const fmt = v => Number(v).toLocaleString('pt-BR');
    const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR');
    const fd = x => x.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    const fh = x => String(x.getHours()).padStart(2, '0') + 'h' + String(x.getMinutes()).padStart(2, '0');
    const car = v => v === 1 ? 'carreta' : 'carretas';
    const prev = d.previstos, feitos = d.turnos, falta = Math.max(0, prev - feitos);
    const ritmo = feitos ? d.qa.me / feitos : 0;
    const proj = Math.round(ritmo * prev);
    const meta = d.qr.me, passou = d.qa.me > meta;
    const precisa = Math.max(0, meta - d.qa.me + 1);
    const porTurno = falta ? precisa / falta : 0;
    const w = v => Math.min(100, v / Math.max(1, meta, d.qa.me, proj) * 100);
    const diaN = Math.min(d.diasPrev, Math.max(1, d.dias));
    let msg;
    if(passou) msg = `<b class="g">🔥 Já passaram a última rodada!</b> ${fmt(d.qa.me)} contra ${fmt(meta)} de ME`;
    else if(!falta) msg = `Faltaram <b>${fmt(precisa)}</b> de ME para passar a última rodada`;
    else msg = `Para passar ${d.nomesRef} (<b>${fmt(meta)}</b>): faltam <b class="y">${fmt(precisa)}</b> de ME em ${falta} turno${falta === 1 ? '' : 's'} · ≈ <b class="y">${fmt1(porTurno)}</b> por turno`;
    return `
    <section class="tvc tv-atual">
      <h2>🔥 Rodada atual <span>começou ${fd(d.ini)} · dia ${diaN} de ${d.diasPrev} · ${feitos} de ${prev} turnos</span></h2>
      <div class="tv-duo">
        ${d.pessoas.map(p => `<div class="tv-p ${p.me ? '' : 'zero'}">
          <div class="tv-p-n">${p.nome}</div>
          <div class="tv-p-me"><b>${fmt(p.me)}</b><span>${car(p.me)} de ME<br><small>${p.turnos} turno${p.turnos === 1 ? '' : 's'} · ${fmt1(p.me / Math.max(1, p.turnos))}/turno</small></span></div>
          <div class="tv-p-l"><span>Tampa <b>${fmt(p.tampa)}</b></span><span>Devol. <b>${fmt(p.dev)}</b></span></div>
          <div class="tv-p-l c"><span>Planta <b>${fmt(p.pc)}</b></span><span>NSA <b>${fmt(p.nsa)}</b></span></div>
        </div>`).join('')}
      </div>
      <div class="tv-sub">📦 Corrida da descarga de ME</div>
      <div class="tv-race">
        <div class="tv-rr now"><span class="l">Rodada atual<small>${d.nomesAtual}</small></span><div class="tr"><i style="width:${w(d.qa.me)}%"></i>${proj > d.qa.me && !passou && falta ? `<i class="proj" style="width:${w(proj)}%"></i>` : ''}</div><b>${fmt(d.qa.me)}</b></div>
        <div class="tv-rr ref"><span class="l">Última rodada<small>${d.nomesRef}</small></span><div class="tr"><i style="width:${w(meta)}%"></i></div><b>${fmt(meta)}</b></div>
      </div>
      <div class="tv-proj">
        ${falta && feitos ? `<div>📈 No ritmo atual (<b>${fmt1(ritmo)}</b> de ME por turno), fecham a rodada com <b>≈ ${fmt(proj)}</b> de ME</div>` : ''}
        <div>${msg}</div>
      </div>
      ${(() => {
        const pp = Math.round(feitos ? d.qa.pc / feitos * prev : 0), mp = d.qr.pc;
        const wp = v => Math.min(100, v / Math.max(1, mp, d.qa.pc, pp) * 100);
        return `<div class="tv-race tv-race2">
          <div class="tv-sub2">🚛 Carregamento na planta</div>
          <div class="tv-rr now"><span class="l">Atual</span><div class="tr"><i style="width:${wp(d.qa.pc)}%"></i>${falta && pp > d.qa.pc ? `<i class="proj" style="width:${wp(pp)}%"></i>` : ''}</div><b>${fmt(d.qa.pc)}</b></div>
          <div class="tv-rr ref"><span class="l">Última</span><div class="tr"><i style="width:${wp(mp)}%"></i></div><b>${fmt(mp)}</b></div>
          ${falta && feitos ? `<div class="tv-p2">no ritmo atual (${fmt1(d.qa.pc / feitos)} por turno) fecham com ≈ <b>${fmt(pp)}</b></div>` : ''}
        </div>`;
      })()}
      <div class="tv-last">🕘 Último registro: <b>${d.ultimo.nome}</b> · Turma ${d.ultimo.turma} · ${fd(d.ultimo.quando)} ${fh(d.ultimo.quando)} · ME ${fmt(d.ultimo.me)} · Planta ${fmt(d.ultimo.pc)} · NSA ${fmt(d.ultimo.nsa)}</div>
    </section>`;
  };

// diminui a escala até tudo caber em 100% da tela, sem rolar
function ajustar() {
  const el = $('tvm'); el.style.setProperty('--k', '1');
  const sobra = () => el.scrollHeight > el.clientHeight + 1 || [...el.querySelectorAll('.tvc')].some(c => c.scrollHeight > c.clientHeight + 1);
  for(let k = 1, i = 0; i < 14 && sobra(); i++) { k -= 0.05; el.style.setProperty('--k', k.toFixed(2)); }
}

function relogio() {
  const d = new Date();
  $('tvm-hora').textContent = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  $('tvm-data').textContent = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}

// tela cheia no primeiro clique/tecla, cursor some parado, tela não apaga
const full = () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); };
addEventListener('pointerdown', full); addEventListener('keydown', full);
const dica = () => { const d = $('tvm-fs'); d.hidden = !!document.fullscreenElement; clearTimeout(dica.t); if(!d.hidden) dica.t = setTimeout(() => d.hidden = true, 15000); };
document.addEventListener('fullscreenchange', () => { dica(); requestAnimationFrame(ajustar); });
let cur; addEventListener('mousemove', () => { $('tvm').classList.remove('nocursor'); clearTimeout(cur); cur = setTimeout(() => $('tvm').classList.add('nocursor'), 3000); });
let lock; async function acordado() { try { if(!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch(e) {} }
document.addEventListener('visibilitychange', () => { if(!document.hidden) { carregar(); acordado(); } });
addEventListener('resize', () => requestAnimationFrame(ajustar));
document.fonts?.ready.then(() => requestAnimationFrame(ajustar));

// Versão online do painel: o arquivo da pasta abre sempre a versão mais nova publicada.
// Se não tiver internet, continua com esta cópia local.
const ONLINE_URL = 'https://claudiogomes2016-cpu.github.io/shiftflow-br3r/tv/painel-tv.html';
if(location.protocol === 'file:') {
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
  fetch(ONLINE_URL + '?v=' + Date.now(), { cache: 'no-store', signal: ctl.signal }).then(r => { if(r.ok) location.replace(ONLINE_URL); }).catch(() => {});
} else {
  // já é a versão online: quando eu publicar uma melhoria, recarrega sozinha (verifica a cada 10 min)
  let base = null;
  const confere = async () => {
    try { const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text(); const h = t.length + ':' + t.slice(-400);
      if(base === null) base = h; else if(h !== base) location.reload(); } catch(e) {}
  };
  confere(); setInterval(confere, 10 * 60000);
}

relogio(); setInterval(relogio, 15000);
carregar(); setInterval(carregar, 60000);
setInterval(() => location.reload(), 6 * 3600000);   // recarrega a cada 6 h (limpa a memória da TV)
acordado(); dica();
</script>
