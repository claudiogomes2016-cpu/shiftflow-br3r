  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n\u002F* latin *\u002F\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"3bb39155-0587-4457-b5e9-312a4060464d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n\u002F* ═══════════════════════════════════════════\n   SHIFTFLOW BR3R — Premium UI v46\n   Referência: Linear · Stripe · Vercel · Apple\n═══════════════════════════════════════════ *\u002F\n\n\u002F* TOKENS *\u002F\n:root {\n  --radius-sm: 10px;\n  --radius: 14px;\n  --radius-md: 18px;\n  --radius-lg: 22px;\n  --transition: 150ms cubic-bezier(0.4,0,0.2,1);\n  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n  --sidebar-w: 248px;\n}\n\n[data-theme=\"dark\"] {\n  --bg:        #08080D;\n  --bg2:       #0D0D14;\n  --bg3:       #13131C;\n  --bg4:       #1A1A25;\n  --bg5:       #23232F;\n  --text:      #F5F5F7;\n  --text2:     #C6C6D2;\n  --text3:     #8B8B9C;\n  --border:    rgba(255,255,255,0.08);\n  --border2:   rgba(255,255,255,0.14);\n  --shadow:    0 12px 36px rgba(0,0,0,0.55);\n  --shadow-sm: 0 2px 14px rgba(0,0,0,0.45);\n  --inp-bg:    #13131C;\n  --card-bg:   #101018;\n  --nav-bg:    #0B0B12;\n  --hover:     rgba(255,255,255,0.05);\n  --blue:      #6C8CFF;\n  --blue-dim:  rgba(108,140,255,0.16);\n  --green:     #22C58B;\n  --green-dim: rgba(34,197,139,0.16);\n  --red:       #F0555F;\n  --red-dim:   rgba(240,85,95,0.16);\n  --yellow:    #F5A524;\n  --yellow-dim:rgba(245,165,36,0.16);\n  --purple:    #B879F5;\n  --purple-dim:rgba(184,121,245,0.18);\n  --orange:    #F97316;\n  --orange-dim:rgba(249,115,22,0.15);\n  --chart-grid: rgba(255,255,255,0.06);\n  --chart-tick: #C6C6D2;\n  --grad-brand: linear-gradient(135deg, #7C7BFF 0%, #B879F5 100%);\n  --grad-soft: radial-gradient(120% 120% at 0% 0%, rgba(124,123,255,0.14) 0%, rgba(184,121,245,0.05) 45%, rgba(0,0,0,0) 75%);\n}\n\n[data-theme=\"light\"] {\n  --bg:        #F5F6FB;\n  --bg2:       #FFFFFF;\n  --bg3:       #FFFFFF;\n  --bg4:       #F0F1F9;\n  --bg5:       #E7E9F5;\n  --text:      #171726;\n  --text2:     #55566B;\n  --text3:     #9494A8;\n  --border:    rgba(23,23,38,0.08);\n  --border2:   rgba(23,23,38,0.12);\n  --shadow:    0 10px 28px rgba(31,31,60,0.08);\n  --shadow-sm: 0 2px 10px rgba(31,31,60,0.05);\n  --inp-bg:    #F0F1F9;\n  --card-bg:   #FFFFFF;\n  --nav-bg:    #FFFFFF;\n  --hover:     rgba(23,23,38,0.03);\n  --blue:      #4F5BEA;\n  --blue-dim:  rgba(79,91,234,0.09);\n  --green:     #0D9668;\n  --green-dim: rgba(13,150,104,0.09);\n  --red:       #E0334F;\n  --red-dim:   rgba(224,51,79,0.08);\n  --yellow:    #D9820A;\n  --yellow-dim:rgba(217,130,10,0.09);\n  --purple:    #8B3FE0;\n  --purple-dim:rgba(139,63,224,0.09);\n  --orange:    #EA580C;\n  --orange-dim:rgba(234,88,12,0.08);\n  --chart-grid: rgba(23,23,38,0.05);\n  --grad-brand: linear-gradient(135deg, #4F5BEA 0%, #8B3FE0 100%);\n  --grad-soft: radial-gradient(120% 120% at 0% 0%, rgba(79,91,234,0.08) 0%, rgba(139,63,224,0.04) 45%, rgba(255,255,255,0) 75%);\n  --chart-tick: #94A3B8;\n}\n\n\u002F* BASE *\u002F\n*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\nhtml { scroll-behavior:smooth; }\nbody {\n  font-family: var(--font);\n  background: var(--grad-soft), var(--bg);\n  background-attachment: fixed;\n  color: var(--text);\n  min-height: 100vh;\n  overflow-x: hidden;\n  -webkit-font-smoothing: antialiased;\n  transition: background var(--transition), color var(--transition);\n}\n\n\u002F* ── LOGIN ── *\u002F\n#sc-login {\n  min-height: 100vh;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n}\n.login-box {\n  width: 100%;\n  max-width: 360px;\n  animation: slideUp 0.4s ease;\n}\n@keyframes slideUp {\n  from { opacity:0; transform:translateY(16px); }\n  to   { opacity:1; transform:translateY(0); }\n}\n.login-logo {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  margin-bottom: 40px;\n}\n.login-ico {\n  width: 56px; height: 56px;\n  border-radius: var(--radius-md);\n  background: var(--grad-brand);\n  display: flex; align-items: center; justify-content: center;\n  margin-bottom: 16px;\n  box-shadow: 0 10px 28px rgba(108,140,255,0.35);\n}\n.login-ico svg { width:26px; height:26px; fill:#fff; }\n.login-brand {\n  font-size: 24px; font-weight: 800;\n  color: var(--text); letter-spacing: -0.5px;\n}\n.login-sub {\n  font-size: 14px; font-weight: 600;\n  color: var(--text2); margin-top: 3px;\n}\n.login-sel {\n  width: 100%; padding: 15px 16px;\n  background: var(--bg3);\n  border: 1.5px solid var(--border2);\n  border-radius: var(--radius);\n  color: var(--text);\n  font-family: var(--font); font-size: 16px; font-weight: 600;\n  outline: none; -webkit-appearance: none; appearance: none;\n  margin-bottom: 24px;\n  transition: border var(--transition), box-shadow var(--transition);\n  cursor: pointer;\n}\n.login-sel:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }\n.login-sel option { background: var(--bg3); }\n.login-pin-label {\n  font-size: 12px; font-weight: 700;\n  color: var(--text2); letter-spacing: 1px; text-transform: uppercase;\n  display: block; margin-bottom: 14px; text-align: center;\n}\n.pin-dots { display:flex; justify-content:center; gap:14px; margin-bottom:20px; }\n.pdot {\n  width: 13px; height: 13px; border-radius: 99px;\n  border: 1.5px solid var(--border2);\n  transition: all var(--transition);\n}\n.pdot.on { background:var(--blue); border-color:var(--blue); box-shadow:0 0 10px rgba(59,130,246,0.4); }\n.pdot.err { background:var(--red); border-color:var(--red); }\n.npad {\n  display: grid; grid-template-columns: repeat(3,1fr); gap:8px;\n  max-width:260px; margin:0 auto 14px;\n}\n.nb {\n  height: 58px; border-radius: var(--radius);\n  background: var(--bg3); border: 1.5px solid var(--border2);\n  color: var(--text); font-family: var(--font); font-weight: 700; font-size: 22px;\n  cursor: pointer; display:flex; align-items:center; justify-content:center;\n  transition: all var(--transition); letter-spacing: -0.3px;\n}\n.nb:hover { background: var(--bg4); border-color: var(--border2); }\n.nb:active { transform: scale(0.94); }\n.nb.e { background:transparent; border:none; cursor:default; }\n.nb.bs { font-size:18px; color:var(--text2); }\n.login-err {\n  background: var(--red-dim); border: 1px solid rgba(239,68,68,0.2); color: #FCA5A5;\n  border-radius: var(--radius-sm); padding: 10px 14px;\n  font-size: 14px; font-weight: 600; text-align:center; margin-bottom:10px; display:none;\n}\n.login-loading { text-align:center; color:var(--text2); font-size:14px; padding:10px; display:none; }\n.login-footer {\n  text-align: center; margin-top: 32px;\n  font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: 0.5px;\n}\n\n\u002F* ── HEADER ── *\u002F\n.hdr {\n  position: fixed; top:0; left:0; right:0; height:60px;\n  background: var(--bg2); border-bottom: 1px solid var(--border);\n  z-index: 900; display:flex; align-items:center; justify-content:space-between;\n  padding: 0 20px;\n  transition: background var(--transition);\n}\n.hdr-left { display:flex; align-items:center; gap:10px; }\n.hdr-ico {\n  width:30px; height:30px; border-radius:9px;\n  background: var(--grad-brand); display:flex; align-items:center; justify-content:center;\n}\n.hdr-ico svg { width:15px; height:15px; fill:#fff; }\n.hdr-brand { font-size:16px; font-weight:800; color:var(--text); letter-spacing:-0.4px; }\n.hdr-sub { font-size:12px; font-weight:600; color:var(--text2); margin-top:1px; }\n.hdr-right { display:flex; align-items:center; gap:8px; }\n.hdr-user { font-size:12px; color:var(--text2); text-align:right; line-height:1.6; font-weight:500; }\n.hdr-user strong { color:var(--blue); display:block; font-weight:700; font-size:13px; }\n.theme-toggle {\n  width:36px; height:20px; border-radius:99px;\n  background:var(--bg4); border:1px solid var(--border2);\n  cursor:pointer; position:relative; flex-shrink:0;\n  transition: background var(--transition);\n}\n.theme-toggle::after {\n  content:''; position:absolute; top:3px; left:3px;\n  width:12px; height:12px; border-radius:99px;\n  background:var(--blue); transition:transform var(--transition);\n}\n[data-theme=\"light\"] .theme-toggle::after { transform:translateX(16px); }\n.logout-btn {\n  padding:5px 11px; border-radius:var(--radius-sm);\n  background:var(--bg4); border:1px solid var(--border2);\n  color:var(--text3); font-family:var(--font); font-size:15px; font-weight:600;\n  cursor:pointer; transition:all var(--transition);\n}\n.logout-btn:hover { border-color:var(--red); color:var(--red); }\n\n\u002F* ── NAV ── *\u002F\n.nav-bot {\n  position:fixed; bottom:0; left:0; right:0; height:64px;\n  background:var(--nav-bg); border-top:1px solid var(--border);\n  display:flex; z-index:900;\n  transition: background var(--transition);\n}\n.side-brand { display:none; }\n.nav-btn {\n  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;\n  gap:4px; cursor:pointer; border:none; background:transparent; position:relative;\n  transition: all var(--transition);\n}\n.nav-btn svg {\n  width:20px; height:20px; stroke:var(--text3); stroke-width:1.7; fill:none;\n  transition: stroke var(--transition);\n}\n.nav-btn span {\n  font-family:var(--font); font-size:14px; font-weight:600;\n  letter-spacing:0.2px; color:var(--text3);\n  transition: color var(--transition);\n}\n.nav-btn.on svg { stroke:var(--blue); }\n.nav-btn.on span { color:var(--blue); }\n.nav-btn.on::after {\n  content:''; position:absolute; bottom:0; left:30%; right:30%;\n  height:2px; background:var(--blue); border-radius: v id=\"occan-detail-list\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><\u002Fdiv>\n\n<div id=\"sc-perf\" class=\"screen app-wrap\">\n<div class=\"wrap-dash\">\n\n  <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:12px\">\n    <div>\n      <div style=\"font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px\">Desempenho <span style=\"color:var(--blue)\">Mensal<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--text3);margin-top:3px\">Diagnóstico por turma — conferência FIFO, produtividade e ocorrências no mesmo lugar<\u002Fdiv>\n    <\u002Fdiv>\n    <select id=\"perf-mes\" class=\"sf\" onchange=\"app.renderPerf()\"><\u002Fselect>\n  <\u002Fdiv>\n\n  <div style=\"font-size:12px;color:var(--text3);margin:10px 0 18px;padding-top:10px;border-top:1px solid var(--border)\">📊 Cada turma é comparada nas 3 frentes do mês: quem mais\u002Fmenos diverge na FIFO, quem mais\u002Fmenos produz e quem mais\u002Fmenos gera ocorrência. Use os parágrafos abaixo como roteiro para a conversa individual.<\u002Fdiv>\n\n  <div id=\"perf-content\"><\u002Fdiv>\n\n  <div class=\"cw mt16\">\n    <div style=\"font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.3px;margin-bottom:6px\">⏱️ TMA por Turma<\u002Fdiv>\n    <div style=\"font-size:13px;color:var(--text3);line-height:1.5;margin-bottom:14px\">Lance aqui os números do painel \"Gestão de Performance Operacional\" (Ball) para o período — os turnos de lá batem com as Turmas A\u002FB\u002FC\u002FD daqui. Formato do TMA: 5h31.<\u002Fdiv>\n    <div class=\"sr\" style=\"margin-bottom:10px\">\n      <div style=\"flex:1\"><span class=\"lbl\" style=\"margin:0 0 4px;display:block\">De<\u002Fspan><input type=\"date\" id=\"tma-periodo-ini\" class=\"inp inp-sm\" style=\"width:100%\"><\u002Fdiv>\n      <div style=\"flex:1\"><span class=\"lbl\" style=\"margin:0 0 4px;display:block\">Até<\u002Fspan><input type=\"date\" id=\"tma-periodo-fim\" class=\"inp inp-sm\" style=\"width:100%\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"tma-form-turmas\"><\u002Fdiv>\n    <button class=\"eb ec\" style=\"width:auto;padding:8px 14px;margin-top:4px\" onclick=\"app.salvarTmaTmc()\">💾 Salvar lançamento<\u002Fbutton>\n    <div style=\"font-size:13px;font-weight:700;color:var(--text2);margin:18px 0 6px\">Histórico de lançamentos<\u002Fdiv>\n    <div id=\"tma-tmc-lista\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><\u002Fdiv>\n\n<nav class=\"nav-bot\">\n  <div class=\"side-brand\"><div class=\"side-brand-ico\"><svg viewBox=\"0 0 24 24\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv><div><div class=\"side-brand-name\">ShiftFlow<\u002Fdiv><div class=\"side-brand-sub\">BR3R Expedição<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <button class=\"nav-btn on\" onclick=\"app.tab('form',this)\"><svg viewBox=\"0 0 24 24\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"><\u002Fpath><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"><\u002Fpath><\u002Fsvg><span>Registro<\u002Fspan><\u002Fbutton>\n  <button class=\"nav-btn\" onclick=\"app.tab('dash',this)\"><svg viewBox=\"0 0 24 24\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"><\u002Fpolyline><\u002Fsvg><span>BI Gestão<\u002Fspan><\u002Fbutton>\n  <button class=\"nav-btn hidden\" id=\"nav-occ-btn\" onclick=\"app.tab('occ',this)\"><svg viewBox=\"0 0 24 24\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg><span>Ocorrências<\u002Fspan><\u002Fbutton>\n  <button class=\"nav-btn hidden\" id=\"nav-perf-btn\" onclick=\"app.tab('perf',this)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M18 17V9\"><\u002Fpath><path d=\"M13 17V5\"><\u002Fpath><path d=\"M8 17v-3\"><\u002Fpath><\u002Fsvg><span>Desempenho Mensal<\u002Fspan><\u002Fbutton>\n<\u002Fnav>\n\n<\u002Fdiv><!-- \u002Fapp -->\n\n<!-- MODAL EDIÇÃO -->\n<div class=\"mb\" id=\"edit-modal\">\n<div class=\"mbx\">\n  <div class=\"mh\"><h3>✏️ Editar Registro<\u002Fh3><button class=\"mc\" onclick=\"app.closeModal()\">✕<\u002Fbutton><\u002Fdiv>\n  <div id=\"modal-fields\"><\u002Fdiv>\n  <div class=\"g2 mt16\">\n    <button onclick=\"app.saveEdit()\" class=\"btn-m\" style=\"padding:14px\">💾 Salvar<\u002Fbutton>\n    <button onclick=\"app.closeModal()\" class=\"btn-s\">Cancelar<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"margin-top:10px\">\n    <button onclick=\"app.deleteEdit()\" style=\"width:100%;padding:13px;border-radius:13px;background:rgba(240,82,82,.12);border:1.5px solid rgba(240,82,82,.35);color:#FF8585;font-family:var(--font);font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px\">🗑️ Excluir Registro<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<input type=\"file\" id=\"cam-inp\" accept=\"image\u002F*\" capture=\"environment\" class=\"hidden\">\n\n<!-- MODAL OCORRÊNCIA -->\n<div class=\"mb\" id=\"occ-modal\">\n<div class=\"mbx\">\n  <div class=\"mh\"><h3 id=\"occ-modal-title\">🚨 Registrar Ocorrência<\u002Fh3><button class=\"mc\" onclick=\"app.closeOccModal()\">✕<\u002Fbutton><\u002Fdiv>\n  <div class=\"mb12\">\n    <span class=\"lbl lr\">Conferente<\u002Fspan>\n    <select id=\"occ-conf\" class=\"inp inp-sm\"><option value=\"\">— Selecione —<\u002Foption><\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"g2 mb12\">\n    <div><span class=\"lbl lr\">Data<\u002Fspan><input type=\"date\" id=\"occ-data\" class=\"inp inp-sm\"><\u002Fdiv>\n    <div><span class=\"lbl lr\">Tipo<\u002Fspan><select id=\"occ-tipo\" class=\"inp inp-sm\"><option>Erro de Procedimento<\u002Foption><option>Indisciplina<\u002Foption><option>Outro<\u002Foption><\u002Fselect><\u002Fdiv>\n  <\u002Fdiv>\n  <span class=\"lbl lr\">Descrição<\u002Fspan>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px\">\n    <button type=\"button\" class=\"eb\" style=\"width:auto;padding:6px 10px;font-size:13px\" onclick=\"app.occQuickTag('Faturou sucata errada')\">+ Faturou sucata errada<\u002Fbutton>\n    <button type=\"button\" class=\"eb\" style=\"width:auto;padding:6px 10px;font-size:13px\" onclick=\"app.occQuickTag('Estornou sucata em centro de custo errado')\">+ Estorno em CC errado<\u002Fbutton>\n    <button type=\"button\" class=\"eb\" style=\"width:auto;padding:6px 10px;font-size:13px\" onclick=\"app.occQuickTag('Enviou certificado de qualidade para cliente errado')\">+ Certificado p\u002F cliente errado<\u002Fbutton>\n  <\u002Fdiv>\n  <textarea id=\"occ-desc\" class=\"inp ta mb16\" style=\"min-height:90px\" placeholder=\"Descreva o ocorrido...\"><\u002Ftextarea>\n  <div class=\"g2\">\n    <button onclick=\"app.saveOcorrencia()\" class=\"btn-m\" style=\"padding:14px\">💾 Salvar<\u002Fbutton>\n    <button onclick=\"app.closeOccModal()\" class=\"btn-s\">Cancelar<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"occ-modal-del-wrap\" style=\"display:none;margin-top:10px\">\n    <button onclick=\"app.deleteOcorrencia()\" style=\"width:100%;padding:13px;border-radius:13px;background:rgba(240,82,82,.12);border:1.5px solid rgba(240,82,82,.35);color:#FF8585;font-family:var(--font);font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px\">🗑️ Excluir Ocorrência<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n<script>\n\u002F\u002F ── SUPABASE CONFIG ──\n\u002F\u002F ── SUPABASE CONFIG ──\nconst SUPA_URL = 'https:\u002F\u002Fqbohupozrbqjplgpqbxr.supabase.co';\nconst SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFib2h1cG96cmJxanBsZ3BxYnhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjY3OTgsImV4cCI6MjA5NjQ0Mjc5OH0.wPxRLIGqfooU5bpV5UZICvH34cQrok2p5nHqYWt0Ye0';\nlet db;\ntry {\n  const { createClient } = supabase;\n  db = createClient(SUPA_URL, SUPA_KEY);\n} catch(e) {\n  console.error('Supabase init error:', e);\n}\n\nconst TURMA_CORES = {A:'#6C8CFF',B:'#B879F5',C:'#22C58B',D:'#F5A524',ADM:'#8B8B9C'};\nconst TURMA_SOLID = {A:'#6C8CFF',B:'#B879F5',C:'#22C58B',D:'#F5A524',ADM:'#8B8B9C'};\nconst TURMA_DIM   = {A:'rgba(108,140,255,0.16)',B:'rgba(184,121,245,0.16)',C:'rgba(34,197,139,0.16)',D:'rgba(245,165,36,0.16)',ADM:'rgba(139,139,156,0.16)'};\nconst MEDALS = {0:'🥇',1:'🥈',2:'🥉'};\n\n\u002F\u002F ── JUSTIFICATIVA TMA — clientes e motivos ──\nconst CLIENTES_BR3R = [\n  \"AB AGUDOS\",\"AB BELEM\",\"AB BRASILI\",\"AB CAMACAR\",\"AB CEBRASA\",\"AB COLORAD\",\n  \"AB CUIABA\",\"AB GUARULH\",\"AB ITAPISS\",\"AB JACAREÍ\",\"AB JAGUARI\",\"AB JUATUBA\",\n  \"AB JUNDIAI\",\"AB LAGES\",\"AB MACACU\",\"AB MANAUS\",\"AB N MINAS\",\"AB N RIO\",\n  \"AB PIRAI\",\"AB SERGIPE\",\"AB UBERLAN\",\"AB VIAMÃO\",\"BALL BRA\",\"BALL EXT\",\n  \"BALL FRUTA\",\"BALL JCI\",\"BALL MAO\",\"BALL POUSO\",\"BALL REC\",\"BALL SUL\",\n  \"BRAC - Ball Aguas Claras\",\"BREX - Ball Extrema\",\"BRITVIC\",\"BRJC - Ball Jacarei\",\n  \"BRPA - Ball Pouso Alegre\",\"BRUDER ES\",\"BRUDERER\",\"CBHOCUSPOC\",\"CC BANDEIR\",\n  \"CC DUQUE D\",\"CC IPIRANG\",\"CC ITABIRI\",\"CC JPA - R\",\"CC JUNDIAI\",\"CC MARILIA\",\n  \"CC MS\",\"CC PORTO A\",\"CC RIBEIRA\",\"CC SANTA M\",\"CCU\",\"CERVEJARIA\",\"CIDADE IMP\",\n  \"GOLD\",\"HNK ITÚ\",\"HNK JACARE\",\"INAB\",\"INAB IND N\",\"INVASION\",\"MALTA\",\n  \"MAUSER DO\",\"MYERS\",\"NEW AGE\",\"NOVA MALTA\",\"NSA EXTREM\",\"NSA TRES R\",\n  \"OU BEB REG\",\"OU C IMPER\",\"OU CERVAM\",\"OU NEW AGE\",\"OU POTY\",\"OUCID PET\",\n  \"PHARMACORP\",\"POLIBRAS\"\n];\n\nconst JUSTIFICATIVAS_TMA = [\n  \"ACIONAMENTO SEM RESPOSTA\",\n  \"AGUARDANDO PRODUÇÃO - LATA NA PROGRAMAÇÃO PCP\",\n  \"AJUSTE DE ORDEM DE VENDA\",\n  \"BLOQUEIO DE ENVIO 12 OZ\",\n  \"CARREGAMENTO DE TAMPAS\",\n  \"CARREGANDO GRADE D+1\",\n  \"ERRO DE MARCAÇÃO\",\n  \"FALTA DE PRODUTO\",\n  \"FILA DE ESPERA\",\n  \"LATA EM LINHA DE PRODUÇÃO\",\n  \"LATA NA PROGRAMAÇÃO DE PRODUÇÃO\",\n  \"LATA NA PROGRAMAÇÃO DE PRODUÇÃO - D 0\",\n  \"LATA NA PROGRAMAÇÃO DE PRODUÇÃO - D+1\",\n  \"LATA NA PROGRAMAÇÃO DE PRODUÇÃO - D+2\",\n  \"LATA NÃO PRODUZIDA\",\n  \"LATA NÃO PROGRAMADA PARA PRODUÇÃO NO PERIODO\",\n  \"LATA NO AG\",\n  \"LATA NO AG \u002F SOLICITADO AJUSTE DE OV\",\n  \"MARCAÇÃO ANTECIPADA\",\n  \"MARCAÇÃO EM COMBOIO\",\n  \"ORDEM DE VENDA DIVERGENTE\",\n  \"PERNOITE\",\n  \"PROBLEMA NA SEFAZ\",\n  \"SEM PROGRAMAÇÃO\",\n  \"SEM PROGRAMAÇÃO GRADE D 0\",\n  \"TAMPA EM LINHA DE PRODUÇÃO\",\n  \"TRANSFERÊNCIA PARA BALL\",\n  \"TRANSFERÊNCIA PARA NSA\",\n  \"TRANSFERÊNCIA PARA NSA - ARMAZENAGEM ESGOTADA\",\n];\n\nconst app = {\n  user: null,\n  fotos: {},\n  turnoSai: '', turnoRec: '',\n  seg: 'nao', qual: 'nao', bauSite: 'nao', empCham: 'nao',\n  editIdx: null, charts: {}, currCam: '',\n  recognition: null, isListening: false,\n  theme: localStorage.getItem('sf_theme') || 'dark',\n  loginPinVal: '',\n  allTurnos: [],\n  realtimeSub: null,\n\n  \u002F\u002F ── INIT ──\n  async init() {\n    document.documentElement.setAttribute('data-theme', this.theme);\n    const themeIcon = document.getElementById('theme-icon');\n    if(themeIcon) themeIcon.textContent = this.theme === 'dark' ? '🌙' : '☀️';\n    await this.loadConferentes();\n  },\n\n  async loadConferentes() {\n    this.showLoading('Carregando...');\n    try {\n      const { createClient } = supabase;\n      const testDb = createClient(SUPA_URL, SUPA_KEY);\n      const { data, error } = await testDb.from('profiles').select('*').eq('ativo', true).order('nome');\n      if(error) throw error;\n      const sel = document.getElementById('login-conf');\n      sel.innerHTML = '<option value=\"\">— Selecione seu nome —<\u002Foption>';\n      this.conferentesMap = {};\n      data.forEach(p => {\n        const opt = document.createElement('option');\n        opt.value = String(p.id);\n        opt.textContent = p.nome;\n        sel.appendChild(opt);\n        this.conferentesMap[String(p.id)] = { nome: p.nome, turma: p.turma, pin: String(p.pin), role: p.role };\n      });\n      if(data.length === 0) {\n        sel.innerHTML = '<option value=\"\">Nenhum conferente cadastrado<\u002Foption>';\n      }\n    } catch(e) {\n      console.error('Erro ao carregar conferentes:', e);\n      document.getElementById('login-conf').innerHTML = '<option value=\"\">Erro ao carregar — tente recarregar<\u002Foption>';\n      document.getElementById('login-err').textContent = 'Erro de conexão. Verifique sua internet.';\n      document.getElementById('login-err').style.display = 'block';\n    }\n    this.hideLoading();\n  },\n\n  \u002F\u002F ── LOGIN PIN ──\n  loginPin(d) {\n    const conf = document.getElementById('login-conf').value;\n    if(!conf) { document.getElementById('login-err').style.display = 'block'; document.getElementById('login-err').textContent = 'Selecione seu nome primeiro!'; setTimeout(() => document.getElementById('login-err').style.display = 'none', 2000); return; }\n    if(this.loginPinVal.length >= 4) return;\n    this.loginPinVal += d;\n    this.updateLoginDots();\n    if(this.loginPinVal.length === 4) {\n      this.verificarLogin();\n    }\n  },\n\n  loginPinBack() {\n    this.loginPinVal = this.loginPinVal.slice(0, -1);\n    this.updateLoginDots();\n    document.getElementById('login-err').style.display = 'none';\n  },\n\n  updateLoginDots() {\n    document.querySelectorAll('#login-dots .pdot').forEach((d, i) => {\n      d.classList.toggle('on', i < this.loginPinVal.length);\n      d.classList.remove('err');\n    });\n  },\n\n  async verificarLogin() {\n    const selEl = document.getElementById('login-conf');\n    const selectedId = selEl.value;\n    const dados = this.conferentesMap && this.conferentesMap[selectedId];\n    if(!dados) { return; }\n    const pinCorreto = dados.pin;\n\n    if(this.loginPinVal === pinCorreto) {\n      this.user = {\n        id: selectedId,\n        nome: dados.nome,\n        turma: dados.turma,\n        role: dados.role,\n        pin: pinCorreto,\n      };\n      this.loginPinVal = '';\n      this.updateLoginDots();\n      this.entrarApp();\n    } else {\n      document.querySelectorAll('#login-dots .pdot').forEach(d => { d.classList.add('err'); d.classList.remove('on'); });\n      document.getElementById('login-err').style.display = 'block';\n      document.getElementById('login-err').textContent = 'PIN incorreto. Tente novamente.';\n      setTimeout(() => {\n        this.loginPinVal = '';\n        this.updateLoginDots();\n        document.getElementById('login-err').style.display = 'none';\n      }, 1200);\n    }\n  },\n\n  entrarApp() {\n    document.getElementById('sc-login').style.display = 'none';\n    document.getElementById('app').classList.remove('hidden');\n    document.getElementById('hdr-nome').textContent = this.user.nome;\n    document.getElementById('hdr-turma').textContent = 'Turma ' + this.user.turma + ' · ' + this.user.role;\n    document.getElementById('conf-display').textContent = this.user.nome;\n    document.getElementById('turno-hint').textContent = '🕐 Turno padrão: ' + this.user.turma;\n    this.setTurno(this.user.turma, null, 'sai');\n    \u002F\u002F Gestor: desbloqueia área automaticamente\n    if(this.user.role === 'gestor') {\n      document.getElementById('gestor-area').classList.remove('hidden');\n      document.getElementById('nav-occ-btn').classList.remove('hidden');\n      document.getElementById('nav-perf-btn').classList.remove('hidden');\n      this.setupRealtime();\n      this.fetchOcorrencias();\n    }\n    document.getElementById('plano-acao') && (document.getElementById('plano-acao').value = localStorage.getItem('sf_plano') || '');\n    this.tampaEntradas = []; this.devEntradas = [];\n    this.tmaHasAbove = 'nao'; this.tmaEntries = [];\n    \u002F\u002F Set default periodo button\n    const defaultBtn = document.querySelector('.periodo-btn.on');\n    if(!defaultBtn) { const btns = document.querySelectorAll('.periodo-btn'); if(btns[2]) btns[2].classList.add('on'); }\n    setTimeout(() => { this.renderTampaLista(); this.renderDevLista(); this.renderTmaLista(); }, 100);\n  },\n\n  logout() {\n    this.user = null;\n    this.loginPinVal = '';\n    this.updateLoginDots();\n    document.getElementById('login-conf').value = '';\n    document.getElementById('sc-login').style.display = 'flex';\n    document.getElementById('app').classList.add('hidden');\n    this.reset();\n    if(this.realtimeSub) { db.removeChannel(this.realtimeSub); this.realtimeSub = null; }\n  },\n\n  \u002F\u002F ── REALTIME ──\n  setupRealtime() {\n    this.realtimeSub = db.channel('turnos-realtime')\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'turnos' }, () => {\n        if(document.getElementById('sc-dash').classList.contains('on')) this.updateDash();\n      })\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'ocorrencias' }, () => {\n        this.fetchOcorrencias();\n      })\n      .subscribe();\n  },\n\n  \u002F\u002F ── THEME ──\n  toggleTheme() {\n    this.theme = this.theme === 'dark' ? 'light' : 'dark';\n    document.documentElement.setAttribute('data-theme', this.theme);\n    const ti = document.getElementById('theme-icon');\n    if(ti) ti.textContent = this.theme === 'dark' ? '🌙' : '☀️';\n    localStorage.setItem('sf_theme', this.theme);\n    if(document.getElementById('sc-dash').classList.contains('on')) this.updateDash();\n    if(document.getElementById('sc-occ').classList.contains('on')) this.renderOccAnalysis();\n  },\n\n  tab(t, el) {\n    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));\n    document.getElementById('sc-' + t).classList.add('on');\n    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));\n    el.classList.add('on');\n    window.scrollTo(0, 0);\n    if(t === 'dash') this.updateDash();\n    if(t === 'occ') this.updateOccAnalysis();\n    if(t === 'perf') this.updatePerf();\n  },\n\n  setTurno(t, btn, tipo) {\n    if(tipo === 'sai') this.turnoSai = t;\n    else this.turnoRec = t;\n    const gId = tipo === 'sai' ? 'turno-g-sai' : 'turno-g-rec';\n    document.querySelectorAll('#' + gId + ' .tp').forEach(b => b.classList.remove('on'));\n    if(btn) btn.classList.add('on');\n    else {\n      const map = {A:0,B:1,C:2,D:3,ADM:4};\n      const pills = document.querySelectorAll('#' + gId + ' .tp');\n      if(map[t] !== undefined && pills[map[t]]) pills[map[t]].classList.add('on');\n    }\n  },\n\n  yn(type, val) {\n    if(type === 'seg') {\n      this.seg = val;\n      document.getElementById('yn-seg-n').classList.toggle('on', val === 'nao');\n      document.getElementById('yn-seg-s').classList.toggle('on', val === 'sim');\n      document.getElementById('seg-x').classList.toggle('on', val === 'sim');\n    } else {\n      this.qual = val;\n      document.getElementById('yn-qual-n').classList.toggle('on', val === 'nao');\n      document.getElementById('yn-qual-s').classList.toggle('on', val === 'sim');\n      document.getElementById('qual-x').classList.toggle('on', val === 'sim');\n    }\n  },\n\n  ynEntrada(tipo, val) {\n    if(tipo === 'tampa') {\n      this.tampaRecebeu = val;\n      document.getElementById('yn-tampa-n').classList.toggle('on', val === 'nao');\n      document.getElementById('yn-tampa-s').classList.toggle('on', val === 'sim');\n      document.getElementById('yn-tampa-n').classList.toggle('no', val === 'nao');\n      document.getElementById('yn-tampa-s').classList.toggle('yes', val === 'sim');\n      document.getElementById('tampa-extra').style.display = val === 'sim' ? 'block' : 'none';\n    } else {\n      this.devRecebeu = val;\n      document.getElementById('yn-dev-n').classList.toggle('on', val === 'nao');\n      document.getElementById('yn-dev-s').classList.toggle('on', val === 'sim');\n      document.getElementByI return 'vazio';\n      const norm = normNome(relato);\n      if(norm.includes('CONFERIDO')) return 'ok';\n      if(norm.includes('CONFERIR')) return 'conferir';\n      if(norm.includes('CARREGANDO')) return 'carregando';\n      const linhas = relato.split('\\n').filter(l => l.trim()).length;\n      if(linhas > 3) return 'longo';\n      return 'ok';\n    };\n    const rotulos = { vazio: 'Vazio', conferir: '\"Conferir\" (pendente)', carregando: '\"Carregando\"', longo: 'Texto longo (>3 linhas)' };\n    const regsMes = (this.allTurnos || []).filter(r => turmas.includes(r.turma_sai) && (r.data_registro || '').startsWith(mesSel));\n    const porTurma = {};\n    turmas.forEach(t => { porTurma[t] = { turma: t, total: 0, divergencias: 0, motivos: {}, conferentes: new Set() }; });\n    const porConf = new Map();\n    regsMes.forEach(r => {\n      const t = r.turma_sai;\n      if(!porTurma[t]) return;\n      const cat = classificar(r.relato);\n      porTurma[t].total++;\n      if(r.conferente) porTurma[t].conferentes.add(r.conferente);\n      if(cat !== 'ok') {\n        porTurma[t].divergencias++;\n        porTurma[t].motivos[cat] = (porTurma[t].motivos[cat] || 0) + 1;\n      }\n      const confNome = (r.conferente || '').trim();\n      if(confNome) {\n        const key = normNome(confNome);\n        if(!porConf.has(key)) porConf.set(key, { nome: confNome, turmas: new Set(), total: 0, divergencias: 0 });\n        const c = porConf.get(key);\n        c.total++;\n        c.turmas.add(t);\n        if(cat !== 'ok') c.divergencias++;\n      }\n    });\n    const dados = turmas.map(t => {\n      const d = porTurma[t];\n      const pct = d.total ? d.divergencias \u002F d.total : 0;\n      return { ...d, pct, conferentes: [...d.conferentes] };\n    });\n    const comRegistro = dados.filter(d => d.total > 0);\n    if(!comRegistro.length) {\n      el.innerHTML = `<p style=\"text-align:center;color:var(--text3);font-size:14px;padding:20px\">Nenhum registro de FIFO neste mês.<\u002Fp>`;\n      return;\n    }\n    const ordenado = [...comRegistro].sort((a,b) => a.pct - b.pct || a.divergencias - b.divergencias || a.turma.localeCompare(b.turma));\n    const melhor = ordenado[0], pior = ordenado[ordenado.length-1];\n    const [ano,mes] = mesSel.split('-');\n    const nomesMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\n    const nomeMes = nomesMes[parseInt(mes,10)-1];\n    const confTxt = (d) => d.conferentes.length ? d.conferentes.join(', ') : '—';\n    const piores = [...porConf.values()].filter(c => c.total > 0).sort((a,b) => (b.divergencias\u002Fb.total) - (a.divergencias\u002Fa.total) || b.divergencias - a.divergencias).slice(0, 5);\n    el.innerHTML = `\n      <div class=\"g2 mb16\">\n        <div style=\"background:var(--green-dim);border:1px solid rgba(34,197,139,0.25);border-radius:var(--radius);padding:16px\">\n          <div style=\"font-size:13px;font-weight:700;color:var(--green);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px\">🏆 Melhor turma · ${nomeMes}<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.5px\">Turma ${melhor.turma}<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--text2);margin-top:2px\">${melhor.divergencias} divergência${melhor.divergencias!==1?'s':''} em ${melhor.total} registro${melhor.total!==1?'s':''} · ${Math.round(melhor.pct*100)}%<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text3);margin-top:6px\">👤 Conferente(s): ${confTxt(melhor)}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--red-dim);border:1px solid rgba(240,85,95,0.25);border-radius:var(--radius);padding:16px\">\n          <div style=\"font-size:13px;font-weight:700;color:var(--red);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px\">⚠️ Pior turma · ${nomeMes}<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.5px\">Turma ${pior.turma}<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--text2);margin-top:2px\">${pior.divergencias} divergência${pior.divergencias!==1?'s':''} em ${pior.total} registro${pior.total!==1?'s':''} · ${Math.round(pior.pct*100)}%<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--text3);margin-top:6px\">👤 Conferente(s): ${confTxt(pior)}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mb16\">\n        ${ordenado.map(d => {\n          const pct = Math.round(d.pct * 100);\n          const cor = d.turma === melhor.turma ? 'var(--green)' : d.turma === pior.turma ? 'var(--red)' : 'var(--yellow)';\n          const motivosTxt = Object.entries(d.motivos).map(([k,v]) => `${rotulos[k]}: ${v}`).join(' · ');\n          return `<div style=\"margin-bottom:12px\">\n            <div style=\"display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--text2);margin-bottom:5px\">\n              <span>Turma ${d.turma} <span style=\"font-weight:500;color:var(--text3)\">· ${confTxt(d)}<\u002Fspan><\u002Fspan>\n              <span>${d.divergencias}\u002F${d.total} · ${pct}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:7px;background:var(--border2);border-radius:99px;overflow:hidden\">\n              <div style=\"height:100%;width:${Math.max(pct,4)}%;background:${cor};border-radius:99px\"><\u002Fdiv>\n            <\u002Fdiv>\n            ${motivosTxt ? `<div style=\"font-size:12px;color:var(--text3);margin-top:4px\">${motivosTxt}<\u002Fdiv>` : ''}\n          <\u002Fdiv>`;\n        }).join('')}\n      <\u002Fdiv>\n      ${piores.length ? `<div style=\"border-top:1px solid var(--border);padding-top:12px\">\n        <div style=\"font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px\">👤 Conferentes com mais divergência no mês<\u002Fdiv>\n        ${piores.map(c => {\n          const pctC = c.total ? Math.round((c.divergencias\u002Fc.total)*100) : 0;\n          return `<div style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border)\">\n            <span>${c.nome} <span style=\"color:var(--text3)\">(Turma ${[...c.turmas].join('\u002F')})<\u002Fspan><\u002Fspan>\n            <span style=\"color:${pctC>=50?'var(--red)':pctC>0?'var(--yellow)':'var(--text3)'}\">${c.divergencias}\u002F${c.total} · ${pctC}%<\u002Fspan>\n          <\u002Fdiv>`;\n        }).join('')}\n      <\u002Fdiv>` : ''}`;\n  },\n\n  renderHist() {\n    const confSel = document.getElementById('hist-conf-filter');\n    if(confSel && confSel.options.length <= 1) {\n      const normNomeF = (n) => (n||'').normalize('NFD').replace(\u002F[\\u0300-\\u036f]\u002Fg,'').trim().toUpperCase();\n      const meuNome = normNomeF(this.user?.nome);\n      const nomes = [...new Set((this.allTurnos || []).map(r => r.conferente).filter(Boolean))]\n        .filter(n => { const k = normNomeF(n); return k !== meuNome && !k.includes('RAFAEL'); })\n        .sort((a,b) => a.localeCompare(b));\n      confSel.innerHTML = '<option value=\"\">Todos os conferentes<\u002Foption>' + nomes.map(n => `<option value=\"${n}\">${n}<\u002Foption>`).join('');\n    }\n    const search = (document.getElementById('hist-search')?.value || '').toLowerCase();\n    const filter = document.getElementById('hist-filter')?.value || '';\n    const confFiltro = confSel?.value || '';\n    let items = this.filtrarPorPeriodo(this.allTurnos);\n    if(this.histTipo === 'seg') items = items.filter(r => r.seg === 'sim');\n    if(this.histTipo === 'qual') items = items.filter(r => r.qual === 'sim');\n    const chip = document.getElementById('hist-tipo-chip');\n    if(chip) {\n      if(this.histTipo) {\n        const lbl = this.histTipo === 'seg' ? '🛡️ Segurança · Incidentes' : '📦 Qualidade · Bloqueios';\n        const col = this.histTipo === 'seg' ? 'var(--red)' : 'var(--yellow)';\n        const dim = this.histTipo === 'seg' ? 'var(--red-dim)' : 'var(--yellow-dim)';\n        chip.style.display = 'flex';\n        chip.innerHTML = `<span class=\"badge\" style=\"background:${dim};color:${col};border:1px solid ${col}\">${lbl}<\u002Fspan><button onclick=\"app.filterByTipo('${this.histTipo}')\" style=\"background:none;border:none;color:var(--text3);font-size:13px;font-weight:600;cursor:pointer\">✕ limpar filtro<\u002Fbutton>`;\n      } else {\n        chip.style.display = 'none';\n        chip.innerHTML = '';\n      }\n    }\n    if(search) items = items.filter(r => r.conferente.toLowerCase().includes(search) || (r.relato||'').toLowerCase().includes(search));\n    if(filter) items = items.filter(r => r.turma_sai === filter);\n    if(confFiltro) items = items.filter(r => r.conferente === confFiltro);\n    if(!items.length) { document.getElementById('hist-list').innerHTML = '<p style=\"text-align:center;color:var(--text3);font-size:14px;padding:20px\">Nenhum registro encontrado.<\u002Fp>'; return; }\n    const isGestor = this.user?.role === 'gestor';\n    document.getElementById('hist-list').innerHTML = items.map(r => `\n      <div class=\"hi\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px\">\n          <div>\n            <div class=\"hc\">${r.conferente}<\u002Fdiv>\n            <div class=\"hd\">${new Date(r.data_registro).toLocaleString('pt-BR')} · Turma ${r.turma_sai} → ${r.turma_rec||'—'}<\u002Fdiv>\n          <\u002Fdiv>\n          ${isGestor ? `<button class=\"he\" onclick=\"app.openModal('${r.id}')\">✏️ Editar<\u002Fbutton>` : ''}\n        <\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--text2);line-height:1.6;margin:8px 0;font-style:italic\">\"${r.relato||''}\"<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n          <span class=\"badge ${r.seg==='sim'?'br2':'bg2'}\">🛡️ ${r.seg==='sim'?'Incidente':'OK'}<\u002Fspan>\n          <span class=\"badge ${r.qual==='sim'?'by2':'bg2'}\">📦 ${r.qual==='sim'?'Bloqueio':'OK'}<\u002Fspan>\n          <span class=\"badge ${r.s_falta==='Sim'?'bp2':'bg2'}\">👷 Sodexo ${r.s_falta}<\u002Fspan>\n          <span class=\"badge bb\">📊 ${(r.p_t||0)+(r.n_t||0)} vol.<\u002Fspan>\n          ${r.tampa_recebeu==='Sim'?`<span class=\"badge bb\">🔲 Tampa ${r.tampa_tipo||''} ${r.tampa_qtd||''}ct.<\u002Fspan>`:''}\n          ${r.devolucao_recebeu==='Sim'?`<span class=\"badge by2\">🔄 Dev. ${r.devolucao_qtd||''}ct.<\u002Fspan>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n  },\n\n  openModal(id) {\n    const r = this.allTurnos.find(t => t.id === id);\n    if(!r) return;\n    this.editId = id;\n    this.editTurnoSai = r.turma_sai || '';\n    this.editTurnoRec = r.turma_rec || '';\n    this.editSeg = r.seg || 'nao';\n    this.editQual = r.qual || 'nao';\n    this.editTampaEntradas = JSON.parse(r.tampa_entradas || '[]');\n    this.editDevEntradas = JSON.parse(r.devolucao_entradas || '[]');\n    this.editTmaHasAbove = r.tma_acima === 'Sim' ? 'sim' : 'nao';\n    this.editTmaEntries = JSON.parse(r.tma_justificativas || '[]');\n    const mkTP = (t, tipo, sel) => `<button class=\"tp${sel===t?' on':''}\" style=\"font-size:${t==='ADM'?'13':'18'}px\" onclick=\"app.setEditTurno('${t}',this,'${tipo}')\">${t}<div class=\"tp-s\">${t==='A'||t==='B'?'06-18h':t==='ADM'?'07-16h':'18-06h'}<\u002Fdiv><\u002Fbutton>`;\n    document.getElementById('modal-fields').innerHTML = `\n      <div style=\"font-family:var(--font);font-weight:700;font-size:14px;color:var(--blue);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)\">👤 Identificação<\u002Fdiv>\n      <div class=\"mb12\"><span class=\"lbl\">Conferente<\u002Fspan>\n        <select id=\"e-conf\" class=\"inp inp-sm\">${['RAFAEL JANUARIO CUNHA','RICKSON CARMO','ROMUALDO AZEVEDO','LUIS DOMINGOS','JOSE CLAUDIO REIS','PAULO TEIXEIRA'].map(function(n){return '<option'+(n===r.conferente?' selected':'')+'>'+n+'<\u002Foption>';}).join('')}<\u002Fselec        const d = new Date(agora0.getFullYear(), agora0.getMonth() - i, 1);\n        const val = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');\n        let lbl = nomesMes0[d.getMonth()] + '\u002F' + String(d.getFullYear()).slice(2);\n        if(i === 0) lbl += ' (atual)'; else if(i === 1) lbl += ' (mês passado)';\n        opts.push(`<option value=\"${val}\"${i===1?' selected':''}>${lbl}<\u002Foption>`);\n      }\n      sel.innerHTML = opts.join('');\n    }\n    const mesSel = sel?.value || '2026-06';\n    const turmas = ['A','B','C','D'];\n    const normNome = (n) => (n||'').normalize('NFD').replace(\u002F[\\u0300-\\u036f]\u002Fg,'').trim().toUpperCase();\n    const classificarFifo = (relatoRaw) => {\n      const relato = (relatoRaw || '').trim();\n      if(!relato) return 'vazio';\n      const norm = normNome(relato);\n      if(norm.includes('CONFERIDO')) return 'ok';\n      if(norm.includes('CONFERIR')) return 'conferir';\n      if(norm.includes('CARREGANDO')) return 'carregando';\n      const linhas = relato.split('\\n').filter(l => l.trim()).length;\n      if(linhas > 3) return 'longo';\n      return 'ok';\n    };\n    const regsMes = (this.allTurnos || []).filter(r => turmas.includes(r.turma_sai) && (r.data_registro || '').startsWith(mesSel));\n    const occMes = (this.allOcorrencias || []).filter(o => (o.data_ocorrencia || '').startsWith(mesSel));\n\n    const turmaPorPessoa = {};\n    regsMes.forEach(r => {\n      const k = normNome(r.conferente);\n      if(!k) return;\n      if(!turmaPorPessoa[k]) turmaPorPessoa[k] = {};\n      turmaPorPessoa[k][r.turma_sai] = (turmaPorPessoa[k][r.turma_sai] || 0) + 1;\n    });\n    const turmaResolvida = {};\n    Object.entries(turmaPorPessoa).forEach(([k, contagem]) => {\n      turmaResolvida[k] = Object.entries(contagem).sort((a,b) => b[1]-a[1])[0][0];\n    });\n\n    const tmaMes = (this.allTmaTmc || []).filter(r => (r.periodo_inicio||'').slice(0,7) === mesSel || (r.periodo_fim||'').slice(0,7) === mesSel);\n    const tmaPorTurma = {};\n    tmaMes.forEach(r => {\n      if(!tmaPorTurma[r.turma]) tmaPorTurma[r.turma] = { soma: 0, peso: 0 };\n      const peso = r.embarques || 1;\n      tmaPorTurma[r.turma].soma += (r.tma_horas || 0) * peso;\n      tmaPorTurma[r.turma].peso += peso;\n    });\n\n    const dados = {};\n    turmas.forEach(t => { dados[t] = { turma: t, fifoTotal: 0, fifoDiverg: 0, pc: 0, pd: 0, nc: 0, ocorrencias: 0 }; });\n    regsMes.forEach(r => {\n      const d = dados[r.turma_sai];\n      if(!d) return;\n      d.fifoTotal++;\n      if(classificarFifo(r.relato) !== 'ok') d.fifoDiverg++;\n      d.pc += r.p_c || 0; d.pd += r.p_d || 0; d.nc += r.n_c || 0;\n    });\n    occMes.forEach(o => {\n      const t = turmaResolvida[normNome(o.conferente)];\n      if(t && dados[t]) dados[t].ocorrencias++;\n    });\n\n    const LIMITE_TMA = 4;\n    const lista = turmas.map(t => {\n      const d = dados[t];\n      const fifoPct = d.fifoTotal ? Math.round(d.fifoDiverg \u002F d.fifoTotal * 100) : 0;\n      const producao = d.pc + d.pd + d.nc;\n      const tmaMedio = tmaPorTurma[t] && tmaPorTurma[t].peso ? tmaPorTurma[t].soma \u002F tmaPorTurma[t].peso : null;\n      return { ...d, fifoPct, producao, tmaMedio };\n    });\n    const comDados = lista.filter(d => d.fifoTotal > 0 || d.producao > 0 || d.ocorrencias > 0);\n    if(!comDados.length) {\n      el.innerHTML = '<p style=\"text-align:center;color:var(--text3);font-size:14px;padding:20px 0\">Nenhum dado neste mês.<\u002Fp>';\n      return;\n    }\n\n    const maxFifo = Math.max(...comDados.map(d => d.fifoPct));\n    const minFifo = Math.min(...comDados.map(d => d.fifoPct));\n    const maxProd = Math.max(...comDados.map(d => d.producao));\n    const minProd = Math.min(...comDados.map(d => d.producao));\n    const maxOcc = Math.max(...comDados.map(d => d.ocorrencias));\n    const minOcc = Math.min(...comDados.map(d => d.ocorrencias));\n    const varios = comDados.length > 1;\n\n    el.innerHTML = comDados.map(d => {\n      const fifoSup = varios && maxFifo > minFifo ? (d.fifoPct === maxFifo ? ' — a maior divergência do grupo' : d.fifoPct === minFifo ? ' — a menor divergência do grupo' : '') : '';\n      const prodSup = varios && maxProd > minProd ? (d.producao === maxProd ? ', o maior volume entre as turmas' : d.producao === minProd ? ', o menor volume entre as turmas' : '') : '';\n      const occSup = varios && maxOcc > minOcc ? (d.ocorrencias === maxOcc && maxOcc > 0 ? ', a maior quantidade entre as turmas' : d.ocorrencias === minOcc ? ', a menor quantidade entre as turmas' : '') : '';\n      const destaqueRuim = d.fifoPct === maxFifo && maxFifo > minFifo;\n      const corBorda = destaqueRuim ? 'rgba(240,85,95,0.35)' : 'var(--border)';\n      const tmaClause = d.tmaMedio != null ? ` O TMA médio ficou em ${this.formatHoras(d.tmaMedio)}${d.tmaMedio>LIMITE_TMA?' — acima do limite de 4h':' — dentro do limite de 4h'}.` : '';\n      const texto = `A Turma ${d.turma} registrou ${d.fifoPct}% de divergência na conferência FIFO${fifoSup}; movimentou ${d.producao} volumes entre Planta e NSA${prodSup}; e teve ${d.ocorrencias} ocorrência${d.ocorrencias!==1?'s':''} no período${occSup}.${tmaClause}`;\n      return `<div class=\"cw\" style=\"border-color:${corBorda};margin-bottom:12px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px\">\n          <span style=\"font-size:16px;font-weight:800;color:var(--text)\">Turma ${d.turma}<\u002Fspan>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <span class=\"badge ${d.fifoPct>=50?'br2':d.fifoPct>0?'by2':'bg2'}\">FIFO ${d.fifoPct}%<\u002Fspan>\n            <span class=\"badge bb\">${d.producao} vol.<\u002Fspan>\n            <span class=\"badge ${d.ocorrencias>0?'by2':'bg2'}\">${d.ocorrencias} ocorr.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--text2);line-height:1.6\">${texto}<\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join('');\n  },\n\n  showLoading(txt) { document.getElementById('loading').classList.add('on'); document.getElementById('loading-txt').textContent = txt || 'Carregando...'; },\n  hideLoading() { document.getElementById('loading').classList.remove('on'); },\n};\n\ndocument.getElementById('cam-inp').onchange = function(e) {\n  const file = e.target.files[0]; if(!file) return;\n  app.fotos[app.currCam] = file;\n  const reader = new FileReader();\n  reader.onload = ev => {\n    const slot = document.getElementById('slot-' + app.currCam);\n    const prev = document.getElementById('prev-' + app.currCam);\n    slot.classList.add('ok');\n    prev.innerHTML = `<img src=\"${ev.target.result}\" class=\"fp2\"><div class=\"fob\">✓<\u002Fdiv>`;\n    app.updateFotoProgress();\n  };\n  reader.readAsDataURL(file);\n  e.target.value = '';\n};\n\nwindow.onload = () => app.init();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
